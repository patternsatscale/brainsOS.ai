name: Pre-Commit & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security-and-lint:
    name: Security & Architecture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Secret & Environment File Protection
        run: |
          echo "Checking for prohibited .env or secret files..."
          FORBIDDEN=$(git ls-files | grep -E '(\.env$|\.key$|\.pem$)' | grep -v '\.env\.example$' || true)
          if [ -n "${FORBIDDEN}" ]; then
            echo "::error::Prohibited secret file found in repository tracking: ${FORBIDDEN}"
            exit 1
          fi
          echo "No sensitive files found in git tree."

      - name: Verify Memory Plane Purity
        run: |
          echo "Ensuring no live memory notes are committed..."
          LIVE_MEMORIES=$(git ls-files data/memories/ | grep -v 'data/memories/\.gitkeep$' || true)
          if [ -n "${LIVE_MEMORIES}" ]; then
            echo "::error::Live memory files found in repository tracking: ${LIVE_MEMORIES}"
            echo "The memory plane is reserved for human-auditable runtime OKF notes and must be git-ignored."
            exit 1
          fi
          echo "Memory plane is clean."

      - name: Verify Agent Workspace Hygiene
        run: |
          echo "Ensuring no live agent workspace state is committed..."
          LIVE_WORKSPACE=$(git ls-files data/workspace/ | grep -v 'data/workspace/\.gitkeep$' || true)
          if [ -n "${LIVE_WORKSPACE}" ]; then
            echo "::error::Live workspace files found in repository tracking: ${LIVE_WORKSPACE}"
            echo "The agent workspace is reserved for runtime packages, tools, and Signal credentials and must be git-ignored."
            exit 1
          fi
          echo "Agent workspace tracking is clean."

      - name: Shell Script Syntax Validation
        run: |
          echo "Validating bash syntax on all scripts..."
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
              echo "✓ $script passed syntax check"
            fi
          done

      - name: Docker Compose Topology Validation
        run: |
          echo "Validating docker-compose.yml configuration..."
          cp .env.example .env
          docker compose config -q
          echo "✓ docker-compose.yml passed topology validation"

      - name: Verify Control Plane Database Isolation & Guardrails
        run: |
          echo "Validating strict database isolation guardrails..."
          
          # 1. Hermes container must have zero database environment variables
          HERMES_DB_ENV=$(docker compose config | awk '/container_name: titan-hermes/,/container_name:/' | grep -iE 'POSTGRES|DATABASE_URL' || true)
          if [ -n "${HERMES_DB_ENV}" ]; then
            echo "::error::Hermes container is exposed to database environment variables: ${HERMES_DB_ENV}"
            exit 1
          fi

          # 2. Database container must NOT share networks with Hermes (titan-ingress or titan-internal)
          DB_NETWORKS=$(docker compose config | awk '/container_name: titan-litellm-db/,/container_name:/' | grep -E 'titan-ingress|titan-internal' || true)
          if [ -n "${DB_NETWORKS}" ]; then
            echo "::error::Database container is attached to Hermes-accessible networks: ${DB_NETWORKS}"
            exit 1
          fi

          # 3. Database port must be bound strictly to 127.0.0.1
          DB_PORTS=$(docker compose config | awk '/container_name: titan-litellm-db/,/container_name:/' | grep -E '0\.0\.0\.0.*5432|:[0-9]+:5432' || true)
          if [ -n "${DB_PORTS}" ]; then
            echo "::error::Database port is not strictly bound to loopback 127.0.0.1: ${DB_PORTS}"
            exit 1
          fi

          # 4. No database files in git tracking
          DB_FILES=$(git ls-files | grep -E '(\.db$|\.sqlite|\.sql$|data/litellm_db/|data/postgres/)' || true)
          if [ -n "${DB_FILES}" ]; then
            echo "::error::Forbidden database files found in git tree: ${DB_FILES}"
            exit 1
          fi

          echo "✓ Database isolation guardrails verified successfully."

