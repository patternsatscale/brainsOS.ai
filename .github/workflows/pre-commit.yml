name: Pre-Commit & Security Checks

on:
  push:
    branches: [main, brainsos]
  pull_request:
    branches: [main, brainsos]

permissions:
  contents: read
  pull-requests: read

jobs:
  security-and-lint:
    name: Security & Architecture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Secret & Environment File Protection
        run: |
          echo "Checking for prohibited .env or secret files..."
          FORBIDDEN=$(git ls-files | grep -E '(\.env$|\.key$|\.pem$)' | grep -v '\.env\.example$' || true)
          if [ -n "${FORBIDDEN}" ]; then
            echo "::error::Prohibited secret file found in repository tracking: ${FORBIDDEN}"
            exit 1
          fi
          echo "No sensitive files found in git tree."

      - name: Verify Memory Plane Purity
        run: |
          echo "Ensuring no live memory notes are committed..."
          LIVE_MEMORIES=$(git ls-files data/agent_memories/ data/memories/ | grep -vE 'data/(agent_memories|memories)/\.gitkeep$' || true)
          if [ -n "${LIVE_MEMORIES}" ]; then
            echo "::error::Live memory files found in repository tracking: ${LIVE_MEMORIES}"
            echo "The memory plane is reserved for human-auditable runtime OKF notes and must be git-ignored."
            exit 1
          fi
          echo "Memory plane is clean."

      - name: Verify Agent Workspace & Platform Hygiene
        run: |
          echo "Ensuring no live agent workspace state, comms data, or platform databases are committed..."
          LIVE_WORKSPACE=$(git ls-files data/agents/ data/agent_workspaces/ data/workspace/ data/comms/ data/telemetry/ data/control_plane/ | grep -vE 'data/(agents|agent_workspaces|workspace|comms|telemetry|control_plane)/\.gitkeep$' || true)
          if [ -n "${LIVE_WORKSPACE}" ]; then
            echo "::error::Live platform state or database files found in repository tracking: ${LIVE_WORKSPACE}"
            echo "The agent workspace, comms, telemetry, and control planes are reserved for runtime packages, tools, and databases and must be git-ignored."
            exit 1
          fi
          echo "Agent workspace and platform tracking is clean."

      - name: Shell Script Syntax Validation
        run: |
          echo "Validating bash syntax on all scripts..."
          find scripts packages/brainsOS-appliance -type f -name "*.sh" -exec bash -n {} +
          echo "✓ All script files passed syntax check"

      - name: Reject Unquoted Python Heredocs with Shell Expansion
        run: |
          echo "Checking scripts for unquoted python3 heredocs with shell expansion..."
          python3 - << 'PYEOF'
          import pathlib
          import re
          import sys

          header_re = re.compile(
              r"""(?:"?\$\{?PYTHON_BIN\}?"?|python3)\s+(?:-\s*)?<<-?\s*(['"]?)([A-Za-z_][A-Za-z0-9_]*)\1"""
          )
          violations = []
          for root_dir in ("scripts", "packages/brainsOS-appliance"):
              root = pathlib.Path(root_dir)
              if not root.exists():
                  continue
              for sh in sorted(root.rglob("*.sh")):
                  lines = sh.read_text(encoding="utf-8", errors="ignore").splitlines()
                  i = 0
                  while i < len(lines):
                      m = header_re.search(lines[i])
                      if m:
                          quote, tag = m.group(1), m.group(2)
                          start = i + 1
                          body = []
                          i += 1
                          while i < len(lines) and lines[i].strip() != tag:
                              body.append(lines[i])
                              i += 1
                          if not quote and "$" in "\n".join(body):
                              violations.append(f"{sh}:{start} (<< {tag})")
                      i += 1
          if violations:
              print("::error::Unquoted python3 heredoc(s) with shell expansion detected:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)
          print("✓ Zero unquoted python3 heredocs with shell expansion found.")
          PYEOF

      - name: Verify Zero Private Fleet Leakage (Rule 11 & Rule 14)
        run: |
          echo "Auditing repository against private fleet references..."
          ./scripts/verify/verify-no-private-refs.sh

      - name: Verify Fleet Manifest Zero-Drift
        run: |
          echo "Validating declarative fleet manifest..."
          pip install pyyaml
          python3 -c "import yaml, os; p = 'config/default_settings/agents.yaml' if os.path.exists('config/default_settings/agents.yaml') else 'config/agents.yaml'; data = yaml.safe_load(open(p)); assert 'agents' in data; print(f'✓ Valid manifest with {len(data[\"agents\"])} agent profiles')"


      - name: Docker Compose Topology Validation
        run: |
          echo "Validating docker-compose.yml configuration..."
          cp .env.example .env
          docker compose config -q
          echo "✓ docker-compose.yml passed topology validation"

      - name: Validate Platform Cloud Infrastructure Types (infra/)
        run: |
          echo "Validating TypeScript types in infra/..."
          cd infra
          npm ci || npm install
          npx sst install
          npm run typecheck
          echo "✓ infra/ TypeScript constructs validated"

      - name: Verify Control Plane Database Isolation & Guardrails
        run: |
          echo "Validating strict database isolation guardrails..."
          COMPOSE_JSON="$(docker compose config --format json)"
          COMPOSE_JSON="${COMPOSE_JSON}" python3 - << 'PYEOF'
          import json
          import os
          import re
          import sys

          raw_json = os.environ.get("COMPOSE_JSON")
          cfg = json.loads(raw_json) if raw_json is not None else json.load(sys.stdin)
          services = cfg.get("services") or {}
          if not services:
              print("::error::docker compose config returned no services.")
              sys.exit(1)

          # 1. Agent / runner containers must have zero database environment variables
          agent_services = {
              name: svc
              for name, svc in services.items()
              if str(svc.get("container_name", "")).startswith("brainsos-agent")
              or name.startswith("runner-")
          }
          if not agent_services:
              print("::error::Rule-6 gate matched zero agent/runner services; failing closed.")
              sys.exit(1)
          for name, svc in sorted(agent_services.items()):
              env = svc.get("environment") or {}
              env_keys = list(env.keys()) if isinstance(env, dict) else [str(e).split("=", 1)[0] for e in env]
              bad_env = [k for k in env_keys if re.search(r"(POSTGRES|DATABASE_URL)", k, re.IGNORECASE)]
              if bad_env:
                  print(f"::error::Agent service {name} exposed to DB env vars: {bad_env}")
                  sys.exit(1)

          # 2. Control Plane DB container must match Rule-6 regex, be expected service 'litellm-db',
          #    stay isolated from ingress/internal networks, and expose zero host ports.
          db_re = re.compile(r"^brainsos-(control-|infra-)?litellm-db$")
          db_services = {
              name: svc
              for name, svc in services.items()
              if db_re.match(str(svc.get("container_name", "")))
          }
          if not db_services:
              print("::error::No service container matched Rule-6 regex brainsos-(control-|infra-)?litellm-db; failing closed.")
              sys.exit(1)

          unexpected = [name for name in db_services if name != "litellm-db"]
          if unexpected:
              print(f"::error::Unexpected service name(s) matched Rule-6 DB regex: {unexpected}")
              sys.exit(1)

          for name, svc in db_services.items():
              nets = list((svc.get("networks") or {}).keys())
              if not nets:
                  print(f"::error::Database service {name} has no networks configured.")
                  sys.exit(1)
              forbidden_nets = [n for n in nets if re.search(r"(brainsos-ingress|brainsos-internal)", n) or n != "brainsos-control-net"]
              if forbidden_nets:
                  print(f"::error::Database service {name} attached to forbidden network(s): {forbidden_nets}")
                  sys.exit(1)
              ports = svc.get("ports") or []
              if ports:
                  print(f"::error::Database service {name} exposes host port binding(s): {ports}")
                  sys.exit(1)

          print(f"✓ Verified Rule-6 DB isolation for {list(db_services.keys())} and {len(agent_services)} agent service(s).")
          PYEOF

          # 3. No database files in git tracking
          DB_FILES=$(git ls-files | grep -E '(\.db$|\.sqlite|\.sql$|data/litellm_db/|data/postgres/)' || true)
          if [ -n "${DB_FILES}" ]; then
            echo "::error::Forbidden database files found in git tree: ${DB_FILES}"
            exit 1
          fi

          echo "✓ Database isolation guardrails verified successfully."

