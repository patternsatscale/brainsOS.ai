name: Deploy brainsOS Cloud Infrastructure (SST)

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "SST deployment stage"
        type: choice
        options:
          - production
          - staging
          - dev
        required: true
        default: "production"
      zone_name:
        description: "Route 53 Hosted Zone Name (e.g. brainsos.ai)"
        required: false
        default: "brainsos.ai"
      subdomain:
        description: "Platform Subdomain (e.g. brainsos)"
        required: false
        default: "brainsos"

concurrency:
  group: brainsos-infra-sst-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy SST Ion Infrastructure to AWS
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event.inputs.stage || 'production' }}
      BRAINSOS_ZONE_NAME: ${{ github.event.inputs.zone_name || 'brainsos.ai' }}
      BRAINSOS_SUBDOMAIN: ${{ github.event.inputs.subdomain || 'brainsos' }}
    steps:
      - name: Checkout brainsOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install Dependencies & Providers
        working-directory: infra
        run: |
          npm ci
          npx sst install

      - name: Validate TypeScript Types
        working-directory: infra
        run: npm run typecheck

      - name: Deploy SST Infrastructure
        working-directory: infra
        run: |
          echo "--> Deploying brainsOS SST platform infrastructure to AWS (${STAGE})..."
          npx sst deploy --stage "${STAGE}"
