<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Deep Substrate Backing -->
  <rect width="1920" height="1080" fill="#07090E"/>

  <!-- Perspective Cube Wireframe Lines -->
  <g stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.18" fill="none">
    <!-- Corner Vanishing Rays to 4 screen corners -->
    <line x1="640" y1="320" x2="0" y2="0"/>
    <line x1="1280" y1="320" x2="1920" y2="0"/>
    <line x1="640" y1="760" x2="0" y2="1080"/>
    <line x1="1280" y1="760" x2="1920" y2="1080"/>

    <!-- Ceiling Perspective Rays -->
    <line x1="800" y1="320" x2="480" y2="0"/>
    <line x1="960" y1="320" x2="960" y2="0"/>
    <line x1="1120" y1="320" x2="1440" y2="0"/>

    <!-- Floor Perspective Rays -->
    <line x1="800" y1="760" x2="480" y2="1080"/>
    <line x1="960" y1="760" x2="960" y2="1080"/>
    <line x1="1120" y1="760" x2="1440" y2="1080"/>

    <!-- Left Wall Perspective Rays -->
    <line x1="640" y1="430" x2="0" y2="270"/>
    <line x1="640" y1="540" x2="0" y2="540"/>
    <line x1="640" y1="650" x2="0" y2="810"/>

    <!-- Right Wall Perspective Rays -->
    <line x1="1280" y1="430" x2="1920" y2="270"/>
    <line x1="1280" y1="540" x2="1920" y2="540"/>
    <line x1="1280" y1="650" x2="1920" y2="810"/>

    <!-- Back Wall Concentric Rectangles -->
    <rect x="640" y="320" width="640" height="440" stroke-opacity="0.22"/>
    <line x1="640" y1="430" x2="1280" y2="430" stroke-dasharray="3 3" stroke-opacity="0.12"/>
    <line x1="640" y1="540" x2="1280" y2="540" stroke-dasharray="3 3" stroke-opacity="0.12"/>
    <line x1="640" y1="650" x2="1280" y2="650" stroke-dasharray="3 3" stroke-opacity="0.12"/>
    <line x1="800" y1="320" x2="800" y2="760" stroke-dasharray="3 3" stroke-opacity="0.12"/>
    <line x1="960" y1="320" x2="960" y2="760" stroke-dasharray="3 3" stroke-opacity="0.12"/>
    <line x1="1120" y1="320" x2="1120" y2="760" stroke-dasharray="3 3" stroke-opacity="0.12"/>

    <!-- Expanding Midground Cube Frame 1 -->
    <rect x="440" y="220" width="1040" height="640" stroke-opacity="0.15"/>

    <!-- Expanding Foreground Cube Frame 2 -->
    <rect x="220" y="110" width="1480" height="860" stroke-opacity="0.18"/>

    <!-- Outer Frame -->
    <rect x="20" y="10" width="1880" height="1060" stroke-opacity="0.12"/>
  </g>

  <!-- Ambient Vignette Shade Overlay -->
  <radialGradient id="centerDarkness" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#07090E" stop-opacity="0.6"/>
    <stop offset="60%" stop-color="#07090E" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#07090E" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#centerDarkness)"/>
</svg>
