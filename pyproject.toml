[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end verification tests",
    "tier1: Feature-level functional and security contract tests",
    "tier2: Boundary value analysis and negative corner-case tests",
    "tier3: Cross-feature pairwise interaction tests",
    "tier4: End-to-end real-world scenario tests",
    "docker_runtime: Local Docker daemon runtime verification tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["mcp.*", "brainsos_mcp.*"]
ignore_missing_imports = true
ignore_errors = true
