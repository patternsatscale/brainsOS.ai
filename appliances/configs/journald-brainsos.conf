# ==============================================================================
# brainsOS: Appliance Systemd Journal Retention Policy (Ticket #317)
# Prevents unattended disk exhaustion by bounding journal log storage.
# Install target: /etc/systemd/journald.conf.d/99-brainsos.conf
# ==============================================================================

[Journal]
# Maximum disk space journal files may use
SystemMaxUse=500M

# Minimum disk space to leave unallocated for other services
SystemKeepFree=1G

# Maximum time to store journal entries
MaxRetentionSec=1month

# Rotate journal files when reaching 1 week
MaxFileSec=1week
