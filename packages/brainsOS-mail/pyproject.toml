[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsOS-mail"
version = "0.1.0"
description = "brainsOS: Lightweight RFC-compliant asynchronous email client for autonomous agents"
readme = "README.md"
authors = [
    { name = "Patterns at Scale", email = "community@patternsatscale.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "boto3>=1.26.0",
]

[project.scripts]
brainsos-mail-ingress = "brainsos_mail.ingress.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
