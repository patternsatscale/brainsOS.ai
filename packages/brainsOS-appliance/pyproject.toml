[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsOS-appliance"
version = "0.1.0"
description = "brainsOS: Appliance Packaging, HashiCorp Packer AMI Pipelines & Cloud-Init Lifecycle Engine"
readme = "README.md"
authors = [
    { name = "Patterns at Scale", email = "community@patternsatscale.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
brainsos-appliance = "brainsos_appliance.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainsos_appliance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end verification tests",
    "tier1: Feature-level functional and security contract tests",
    "tier2: Boundary value analysis and negative corner-case tests",
    "tier3: Cross-feature pairwise interaction tests",
    "tier4: End-to-end real-world scenario tests",
    "docker_runtime: Local Docker daemon runtime verification tests",
]
