[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsOS-terminal"
version = "0.1.0"
description = "brainsOS: System Terminal CLI & Operational Gateway Suite"
readme = "README.md"
authors = [
    { name = "Patterns at Scale", email = "community@patternsatscale.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
make = "brainsos_terminal.make:main"
brainsos = "brainsos_terminal.cli:main"
brainsos-urls = "brainsos_terminal.urls:main"
brainsos-status = "brainsos_terminal.status:main"
brainsos-models = "brainsos_terminal.models:main"
brainsos-chat = "brainsos_terminal.chat:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
