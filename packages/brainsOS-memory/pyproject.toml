[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsOS-memory"
version = "0.1.0"
description = "brainsOS Open Knowledge Format (OKF) & Hybrid Memory Engine"
readme = "README.md"
authors = [
    { name = "Patterns at Scale", email = "community@patternsatscale.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
vector = [
    # Vector store drivers (Qdrant, Chroma, etc.) will be declared here by the memory contributor
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
