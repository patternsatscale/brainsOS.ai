# ==============================================================================
# Project Titan: LiteLLM Control Plane Configuration
# Enforces rate limiting, hardware serialization, and virtual key routing
# ==============================================================================

model_list:
  # Primary Agent Model Alias
  - model_name: titan-core
    litellm_params:
      model: ollama_chat/gemma2:2b
      api_base: http://127.0.0.1:11434
      # Hardware serialization: Protects unified LPDDR5x memory bus on GB10 / Apple Silicon
      max_parallel_requests: 1
      timeout: 300

  # Direct Model Name Aliases
  - model_name: gemma2:2b
    litellm_params:
      model: ollama_chat/gemma2:2b
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300

  - model_name: llama3.2:3b
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 300

general_settings:
  # Master key used by Hermes agent runtime to authenticate with LiteLLM control plane
  master_key: os.environ/HERMES_LITELLM_KEY
