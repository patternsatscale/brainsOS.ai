# ==============================================================================
# brainsOS: LiteLLM Control Plane Configuration
# Enforces rate limiting, hardware serialization, and virtual key routing
# ==============================================================================

model_list:
  # Primary Agent Model Alias
  - model_name: brainsos-core
    litellm_params:
      model: os.environ/BRAINSOS_CORE_MODEL
      api_base: http://127.0.0.1:11434
      # Hardware serialization: Protects unified LPDDR5x memory bus on GB10 / Apple Silicon
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

  # Direct Model Name Aliases
  - model_name: qwen3.8:latest
    litellm_params:
      model: ollama_chat/qwen3.8:latest
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

  - model_name: llama3.2:3b
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

  - model_name: qwen2.5:latest
    litellm_params:
      model: ollama_chat/qwen2.5:latest
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

  # Cindy Pawford Rotated Coding Model Alias
  - model_name: cindy-active-coding-model
    litellm_params:
      model: ollama_chat/qwen2.5:latest
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

  # Development / Fallback Model Alias (Local macOS & Lightweight Testing)
  - model_name: gemma2:2b
    litellm_params:
      model: ollama_chat/gemma2:2b
      api_base: http://127.0.0.1:11434
      max_parallel_requests: 1
      timeout: 300
      num_ctx: 4096

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 300
  success_callback:
    - langfuse
    - otel
  failure_callback:
    - langfuse
    - otel

general_settings:
  # Master key for administrative control, dynamic model addition, and virtual key provisioning
  master_key: os.environ/LITELLM_MASTER_KEY
  # Dedicated PostgreSQL control plane database connection
  database_url: os.environ/DATABASE_URL
  # Dynamic persistence: stores model definitions in database across restarts
  store_model_in_db: true
