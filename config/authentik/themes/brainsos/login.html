<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brainsOS.AI • Operator Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B0E14'/><circle cx='50' cy='50' r='30' fill='%2300f2fe'/></svg>">
  <link rel="stylesheet" href="/static/dist/login.css">
</head>
<body class="login-shell grid-lines">

  <!-- Ambient Radial Glow -->
  <div class="ambient-glow"></div>

  <!-- Spacer to center cleanly vertically -->
  <div class="login-spacer"></div>

  <!-- Center Stage: Authentik Sign-In Card -->
  <main class="login-main">

    <div class="sso-card">

      <!-- Brand Header: Splashy Commanding Title with Monospace Identity -->
      <div class="login-header">

        <div class="login-brand-wrap">
          <span class="login-title">
            BRAINSOS<span class="login-title-accent">.AI</span>
          </span>
        </div>

        <p class="login-subtitle">
          SAFE, SECURE, ASYNCHRONOUS AGENTS
        </p>

        <div class="login-header-rule"></div>

        <h1 class="login-heading">
          brainsOS • Operator Sign In
        </h1>
        <p class="login-caption">
          Login to continue to brainsOS Appliance.
        </p>
      </div>

      <!-- Authentication Form (Integrated with Authentik Flow Action) -->
      <form id="login-form" method="POST" action="%(url)s" class="login-form">
        <input type="hidden" name="csrfmiddlewaretoken" value="%(csrf_token)s">

        <!-- Field 1: Operator Username -->
        <div>
          <label class="login-label" for="username">
            Operator Username
          </label>
          <div class="login-input-wrap">
            <div class="login-input-icon" aria-hidden="true">
              <svg class="login-icon login-icon--sm" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
              </svg>
            </div>
            <input
              id="username"
              name="uid"
              type="text"
              required
              class="login-input"
              placeholder="operator"
              value="operator"
            >
          </div>
        </div>

        <!-- Field 2: Password -->
        <div>
          <label class="login-label" for="password">
            Password
          </label>
          <div class="login-input-wrap">
            <div class="login-input-icon" aria-hidden="true">
              <svg class="login-icon login-icon--sm" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Z"/>
              </svg>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              required
              class="login-input login-input--password"
              placeholder="Enter password"
            >
            <button
              type="button"
              onclick="togglePassword()"
              class="login-toggle-btn"
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
              aria-pressed="false"
              id="password-toggle-btn"
            >
              <svg id="password-eye-open" class="login-icon login-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="password-eye-closed" class="login-icon login-icon--sm is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 3 18 18"/>
                <path d="M10.58 10.58a2 2 0 0 0 2.84 2.84"/>
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Checkbox: Remember me -->
        <div class="login-remember-row">
          <label class="login-remember-label">
            <input
              type="checkbox"
              name="remember_me"
              checked
              class="login-checkbox"
            >
            <span class="login-remember-text">Remember me</span>
          </label>
        </div>

        <!-- Primary Action: Sign In Button -->
        <div class="login-submit-wrap">
          <button
            type="submit"
            id="btn-submit"
            class="login-submit"
          >
            <span id="btn-text">SIGN IN</span>
            <svg id="btn-icon" class="login-icon login-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </div>

        <!-- Divider -->
        <div class="login-divider">
          <div class="login-divider-line"></div>
          <span class="login-divider-label">
            OR CONTINUE WITH
          </span>
        </div>

        <!-- Passkey & Social Logins -->
        <div class="login-alt-group">
          <!-- Passkey / Security Key -->
          <a
            href="/flows/-/default/authentication/?stage=webauthn"
            class="login-alt-btn"
          >
            <svg class="login-icon login-icon--md login-alt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
              <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
              <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
              <path d="M2 12a10 10 0 0 1 18-6"/>
              <path d="M2 16h.01"/>
              <path d="M21.8 16c.2-2 .13-5.52-.3-7"/>
              <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
              <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
              <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
            </svg>
            <span>Sign in with Passkey</span>
          </a>

          <!-- Social Logins Grid: GitHub & Google -->
          <div class="login-oauth-grid">
            <a
              href="/source/oauth/github/"
              class="login-alt-btn login-oauth-btn"
              title="Sign in with GitHub"
            >
              <svg class="login-icon login-oauth-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.55v-2.16c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.55A11.5 11.5 0 0 0 12 .5Z"/>
              </svg>
              <span>GitHub</span>
            </a>

            <a
              href="/source/oauth/google/"
              class="login-alt-btn login-oauth-btn"
              title="Sign in with Google"
            >
              <svg class="login-icon login-icon--sm login-oauth-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21.35 11.1H12v3.78h5.34c-.23 1.24-.94 2.29-2 2.99v2.48h3.23c1.89-1.74 2.98-4.3 2.98-7.35 0-.64-.06-1.28-.2-1.9ZM12 22c2.7 0 4.96-.9 6.62-2.43l-3.23-2.48c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.06v2.56A10 10 0 0 0 12 22Zm-5.61-8.08A5.99 5.99 0 0 1 6.08 12c0-.66.11-1.31.31-1.92V7.52H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.48l3.33-2.56ZM12 5.95c1.47 0 2.79.51 3.83 1.5l2.87-2.87C16.95 2.96 14.7 2 12 2A10 10 0 0 0 3.06 7.52l3.33 2.56C7.18 7.71 9.39 5.95 12 5.95Z"/>
              </svg>
              <span>Google</span>
            </a>
          </div>
        </div>

      </form>

      <!-- Card Footer: Full-Width Version Box Across the Whole Bottom -->
      <div class="login-version-bar">
        <span>v1.0.0-arm64</span>
      </div>

    </div>

  </main>

  <!-- Clean Minimal Footer -->
  <footer class="login-footer">
    <div class="login-footer-row">
      <span>brainsOS.ai</span>
      <span>•</span>
      <span class="login-footer-muted">ASUS Ascent GX10 Appliance</span>
    </div>
  </footer>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeOpen = document.getElementById('password-eye-open');
      const eyeClosed = document.getElementById('password-eye-closed');
      const toggleBtn = document.getElementById('password-toggle-btn');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeOpen.classList.add('is-hidden');
        eyeClosed.classList.remove('is-hidden');
        if (toggleBtn) toggleBtn.setAttribute('aria-pressed', 'true');
      } else {
        passwordInput.type = 'password';
        eyeOpen.classList.remove('is-hidden');
        eyeClosed.classList.add('is-hidden');
        if (toggleBtn) toggleBtn.setAttribute('aria-pressed', 'false');
      }
    }
  </script>
</body>
</html>
