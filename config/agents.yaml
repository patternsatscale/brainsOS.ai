# ==============================================================================
# Project Titan: Multi-Agent Fleet Manifest
# Single source of truth for all autonomous agent units.
# Structured top-down across architectural layers (L1 to L4).
# ==============================================================================

version: "1.0"

agents:
  # ----------------------------------------------------------------------------
  # Agent Unit: Primary Operations Agent
  # ----------------------------------------------------------------------------
  - id: "primary"
    name: "Titan Primary Operations Agent"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "primary.titan.local"
      port: 8642
      dashboard_port: 9119
      signal:
        enabled: true
      telegram:
        enabled: false
        bot_name: "@TitanPrimary_bot"
        token_env: "TELEGRAM_BOT_TOKEN_PRIMARY"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_PRIMARY"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/personas/primary.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "qwen3.8:latest"

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/memories/agents/primary"
    workspace:
      path: "./data/workspace/primary"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 50.00
      virtual_key: "HERMES_LITELLM_KEY"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true

  # ----------------------------------------------------------------------------
  # Agent Unit: Football Dan - Sports Analytics
  # ----------------------------------------------------------------------------
  - id: "football-dan"
    name: "Football Dan - Sports Analytics"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "football-dan.titan.local"
      port: 8643
      dashboard_port: 9120
      signal:
        enabled: false
      telegram:
        enabled: false
        bot_name: "@FootballDan_bot"
        token_env: "TELEGRAM_BOT_TOKEN_FOOTBALL_DAN"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_FOOTBALL_DAN"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/personas/football-dan.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "llama3.2:3b"

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/memories/agents/football-dan"
    workspace:
      path: "./data/workspace/football-dan"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 25.00
      virtual_key: "HERMES_FOOTBALL_DAN_KEY"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true

  # ----------------------------------------------------------------------------
  # Agent Unit: Cindy Pawford - Creative Director & Supermodel CEO
  # ----------------------------------------------------------------------------
  - id: "cindy-pawford"
    name: "Cindy Pawford - Creative Director & Supermodel CEO"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "cindypawford.titan.local"
      port: 8644
      dashboard_port: 9121
      signal:
        enabled: false
      telegram:
        enabled: true
        bot_name: "@CindyPawfordBot"
        token_env: "TELEGRAM_BOT_TOKEN_CINDY"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_CINDY"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/personas/cindy-pawford.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "cindy-active-coding-model"
        - "llama3.2:3b"
        - "qwen2.5:latest"
    cron:
      - id: "daily-feature-drop"
        name: "Daily Feature Drop"
        schedule: "0 2 * * 1-6"
        prompt: "Using your active coding engine (cindy-active-coding-model), inspect the live site files in /app/html (index.html, styles.css, app.js), review top community ideas, and implement 1-2 spontaneous haute-couture canine features or aesthetic refinements."
      - id: "weekly-era-reset"
        name: "Weekly Era Reset"
        schedule: "0 2 * * 0"
        prompt: "Write closing recap.json in /app/html, touch .archive-ready in /app/html to trigger the archive seal, wait for clean slate reset, and brainstorm the grand vision for next week's theme."

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/memories/agents/cindy-pawford"
    workspace:
      path: "./data/workspace/cindy-pawford"
      site_path: "./apps/cindypawford/site"
      canvas_mount: "/app/html"
      repo_url: "https://github.com/patternsatscale/CindyPawford-Online.git"
      protected_paths:
        - ".github"
    git:
      user_name: "Cindy Pawford"
      user_email: "cindy@cindypawford.com"
      token_env: "GITHUB_TOKEN_CINDY"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 25.00
      virtual_key: "HERMES_CINDY_LITELLM_KEY"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true
