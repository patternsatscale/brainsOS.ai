# ==============================================================================
# Project Titan: Multi-Agent Fleet Manifest
# Single source of truth for all autonomous agent units.
# Structured top-down across architectural layers (L1 to L4).
# ==============================================================================

version: "1.0"

agents:
  # ----------------------------------------------------------------------------
  # Agent Unit: Primary Operations Agent
  # ----------------------------------------------------------------------------
  - id: "terrastella"
    name: "Terrastella - Primary Operations Agent"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "terrastella.titan.local"
      port: 8642
      dashboard_port: 9119
      signal:
        enabled: true
        http_url: "http://signal-cli:8080"
        account_env: "SIGNAL_ACCOUNT"
        allowed_users_env: "SIGNAL_ALLOWED_USERS"
      telegram:
        enabled: false
        bot_name: "@Terrastella_bot"
        token_env: "TELEGRAM_BOT_TOKEN_TERRASTELLA"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_TERRASTELLA"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/terrastella/SOUL.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "qwen3.8:latest"

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/agent_memories/terrastella"
    workspace:
      path: "./data/agent_workspaces/terrastella"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 50.00
      virtual_key: "HERMES_LITELLM_KEY"

    # L4: Tool Egress Inspection Proxy & Gateway
    egress:
      enabled: true
      http_proxy: "http://titan-net-egress-proxy:8082"
      https_proxy: "http://titan-net-egress-proxy:8082"
      no_proxy: "localhost,127.0.0.1,host.docker.internal,proxy.local,litellm,signal-cli,titan-signal-cli,titan-net-signal-cli,titan-litellm-db,titan-infra-litellm-db,.titan.local,*.titan.local,titan.local,.titan.internal,*.titan.internal,titan.internal"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true

  # ----------------------------------------------------------------------------
  # Agent Unit: Football Dan - Sports Analytics
  # ----------------------------------------------------------------------------
  - id: "football-dan"
    name: "Football Dan - Sports Analytics"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "football-dan.titan.local"
      port: 8643
      dashboard_port: 9120
      signal:
        enabled: false
      telegram:
        enabled: false
        bot_name: "@FootballDan_bot"
        token_env: "TELEGRAM_BOT_TOKEN_FOOTBALL_DAN"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_FOOTBALL_DAN"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/football-dan/SOUL.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "llama3.2:3b"

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/agent_memories/football-dan"
    workspace:
      path: "./data/agent_workspaces/football-dan"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 25.00
      virtual_key: "HERMES_FOOTBALL_DAN_KEY"

    # L4: Tool Egress Inspection Proxy & Gateway
    egress:
      enabled: true
      http_proxy: "http://titan-net-egress-proxy:8082"
      https_proxy: "http://titan-net-egress-proxy:8082"
      no_proxy: "localhost,127.0.0.1,host.docker.internal,proxy.local,litellm,signal-cli,titan-signal-cli,titan-net-signal-cli,titan-litellm-db,titan-infra-litellm-db,.titan.local,*.titan.local,titan.local,.titan.internal,*.titan.internal,titan.internal"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true

  # ----------------------------------------------------------------------------
  # Agent Unit: Cindy Pawford - Creative Director & Supermodel CEO
  # ----------------------------------------------------------------------------
  - id: "cindy-pawford"
    name: "Cindy Pawford - Creative Director & Supermodel CEO"
    enabled: true

    # L1: Communications & UX Ingress
    comms:
      subdomain: "cindypawford.titan.local"
      extra_domains:
        - "cindypawford.com"
      port: 8644
      dashboard_port: 9121
      signal:
        enabled: false
      telegram:
        enabled: true
        bot_name: "@CindyPawfordBot"
        token_env: "TELEGRAM_BOT_TOKEN_CINDY"
        allowed_users_env: "TELEGRAM_ALLOWED_USERS_CINDY"

    # L2: Agent Core Runtime
    runtime: "hermes"
    persona: "config/hermes/cindy-pawford/SOUL.md"
    models:
      default: "titan-core"
      available:
        - "titan-core"
        - "cindy-active-coding-model"
        - "llama3.2:3b"
        - "qwen2.5:latest"

    # Generic Sub-Agents Specification
    subagents:
      - id: "web-developer"
        name: "Website Builder Sub-Agent"
        tool_name: "build_website_feature"
        description: "Builds or updates HTML5, CSS, and JavaScript features on the public canvas (/app/html) under a clean software engineering persona without conversational artifacts."
        persona: "config/hermes/cindy-pawford/web-developer/SOUL.md"
        model: "cindy-active-coding-model"
        target_dir: "/app/html"
        parameters:
          feature_name:
            type: "string"
            description: "Short descriptive feature title"
            required: true
          specification:
            type: "string"
            description: "Detailed UX requirements, behavior, and layout intent"
            required: true
          target_files:
            type: "array"
            description: "Specific files to inspect or modify"
            default: ["index.html", "styles.css", "app.js"]
          design_tokens:
            type: "object"
            description: "Visual style constraints, color palettes, and typography guidance"
        quality_gate:
          type: "web_code"
          sanitizer: "strip_fences_and_personality"
          syntax_check: "node_check"

    cron:
      - id: "daily-feature-drop"
        name: "Daily Feature Drop"
        schedule: "0 2 * * 1-6"
        prompt: "As Creative Director, inspect live site files in /app/html (index.html, styles.css, app.js), review top community ideas, formulate technical specifications, and invoke the website builder sub-agent via build_website_feature with structured parameters. Then report the clean shipped diff back to fans."
      - id: "weekly-era-reset"
        name: "Weekly Era Reset"
        schedule: "0 2 * * 0"
        prompt: "Write closing recap.json in /app/html, touch .archive-ready in /app/html to trigger the archive seal, wait for clean slate reset, and brainstorm the grand vision for next week's theme."

    # L3: Memory Plane & Tool Sandbox
    memory:
      path: "./data/agent_memories/cindy-pawford"
    workspace:
      path: "./data/agent_workspaces/cindy-pawford"
      site_path: "./apps/cindypawford/site"
      canvas_mount: "/app/html"
      repo_url: "https://github.com/patternsatscale/CindyPawford-Online.git"
      protected_paths:
        - ".github"
    git:
      user_name: "Cindy Pawford"
      user_email: "cindy@cindypawford.com"

    # L4: Routing & Security (LiteLLM Control Plane)
    routing:
      budget_monthly_usd: 25.00
      virtual_key: "HERMES_CINDY_LITELLM_KEY"

    # L4: Tool Egress Inspection Proxy & Gateway
    egress:
      enabled: true
      http_proxy: "http://titan-net-egress-proxy:8082"
      https_proxy: "http://titan-net-egress-proxy:8082"
      no_proxy: "localhost,127.0.0.1,host.docker.internal,proxy.local,litellm,signal-cli,titan-signal-cli,titan-net-signal-cli,titan-litellm-db,titan-infra-litellm-db,.titan.local,*.titan.local,titan.local,.titan.internal,*.titan.internal,titan.internal"

    # Cross-Cutting: Observability & Evaluation
    observability:
      otel_tracing: true
