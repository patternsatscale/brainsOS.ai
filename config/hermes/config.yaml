# ==============================================================================
# Project Titan: Hermes Agent Configuration Template
# Pre-configured for local-first zero-trust inference via LiteLLM control plane
# ==============================================================================

_config_version: 12

model:
  default: "titan-core"
  provider: "custom"
  base_url: "http://proxy.local:4000/v1"

providers:
  custom:
    name: "LiteLLM Proxy"
    base_url: "http://proxy.local:4000/v1"
    key_env: "OPENAI_API_KEY"
    discover_models: true

agent:
  name: "titan"

database:
  journal_mode: "wal"

runtime:
  nofile_soft_limit: 4096

terminal:
  backend: "local"
  timeout: 180

plugins:
  enabled:
    - hermes-okf

platforms:
  api_server:
    enabled: true
  signal:
    enabled: false
  telegram:
    enabled: false

monitoring:
  install_id: "titan-hermes"
  gateway_health_export:
    enabled: true
    metrics_enabled: true
    diagnostic_events_enabled: true
    warning_error_events_enabled: true
    export_interval_seconds: 60
    logs_export_interval_seconds: 5
    resource_attributes:
      service.name: "hermes-gateway"
      deployment.environment.name: "production"
  export:
    otlp:
      enabled: true
      endpoint: "http://langfuse.titan.local:3001/api/public/otel/v1/traces"
      headers_env:
        Authorization: LANGFUSE_OTEL_AUTH

