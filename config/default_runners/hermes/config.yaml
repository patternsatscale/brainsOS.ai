# ==============================================================================
# brainsOS: Hermes Agent Configuration Template
# Pre-configured for local-first zero-trust inference via LiteLLM control plane
# ==============================================================================

_config_version: 12

model:
  default: "qwen3.8:latest"
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  context_length: 65536

providers:
  custom:
    name: "LiteLLM Proxy"
    base_url: "http://litellm:4000/v1"
    key_env: "OPENAI_API_KEY"
    discover_models: true

agent:
  name: "brainsos"

# Long-term memory is owned by brainsOS (OKF Markdown in /memories), so Hermes' internal
# memory store and skill/memory nudges are disabled. Nudges also spawn background LLM
# review calls that would compete with the main run for the single GPU slot (Rule 3).
skills:
  creation_nudge_interval: 0

memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0

database:
  journal_mode: "wal"

runtime:
  nofile_soft_limit: 4096

terminal:
  backend: "local"
  timeout: 180

tools:
  tool_search:
    enabled: "off"
  web_search:
    enabled: true

mcp_servers:
  brainsos:
    command: "python"
    args: ["-m", "brainsos_mcp.server"]

plugins:
  enabled:
    - "observability/langfuse"

platforms:
  api_server:
    enabled: true
  signal:
    enabled: false
  telegram:
    enabled: false
  email:
    enabled: false

monitoring:
  install_id: "brainsos-hermes"
  gateway_health_export:
    enabled: true
    metrics_enabled: true
    diagnostic_events_enabled: true
    warning_error_events_enabled: true
    export_interval_seconds: 60
    logs_export_interval_seconds: 0
    resource_attributes:
      service.name: "hermes-gateway"
      deployment.environment.name: "production"
  export:
    otlp:
      enabled: true
      endpoint: "http://host.docker.internal:3001/api/public/otel/v1/traces"
      headers_env:
        Authorization: LANGFUSE_OTEL_AUTH

