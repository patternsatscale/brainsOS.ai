# ==============================================================================
# brainsOS: Hermes Agent Configuration Template
# Pre-configured for local-first zero-trust inference via LiteLLM control plane
# ==============================================================================

_config_version: 50

model:
  default: "qwen3.8:latest"
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  context_length: 65536

providers:
  custom:
    name: "LiteLLM Proxy"
    base_url: "http://litellm:4000/v1"
    key_env: "OPENAI_API_KEY"
    discover_models: true

agent:
  name: "brainsos"

# Long-term memory is owned by brainsOS (OKF Markdown in /memories), so Hermes' internal
# memory store and skill/memory nudges are disabled. Nudges also spawn background LLM
# review calls that would compete with the main run for the single GPU slot (Rule 3).
skills:
  creation_nudge_interval: 0

  # Active skills (catalog definitions injected into system prompt <available_skills>):
  enabled:
    - codebase-inspection
    - hermes-agent

  # Inactive skills (excluded from system prompt to conserve thousands of tokens):
  # To re-activate a skill, simply move it from 'disabled' to 'enabled' (or comment it out here).
  disabled:
    - airtable
    - architecture-diagram
    - arxiv
    - ascii-video
    - baoyu-infographic
    - blocked-page-recovery
    - box
    - claude-code
    - claude-design
    - codex
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - gif-search
    - github
    - google-workspace
    - grounded-citations
    - hermes-agent-skill-authoring
    - himalaya
    - humanizer
    - inspecting-hermes-desktop-dom
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - p5js
    - pdf
    - popular-web-designs
    - powerpoint
    - product-price-monitor
    - python-debugpy
    - requesting-code-review
    - simplify-code
    - songsee
    - songwriting-and-ai-music
    - spike
    - systematic-debugging
    - teams-meeting-pipeline
    - test-driven-development
    - weekly-review-planning
    - xlsx
    - xurl
    - youtube-content

memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0

database:
  journal_mode: "wal"

runtime:
  nofile_soft_limit: 4096

terminal:
  backend: "local"
  timeout: 180

tools:
  tool_search:
    enabled: "off"
  web_search:
    enabled: true

mcp_servers:
  brainsos:
    command: "python"
    args: ["-m", "brainsos_mcp.server"]

plugins:
  enabled:
    - "observability/langfuse"

platforms:
  api_server:
    enabled: true
  signal:
    enabled: false
  telegram:
    enabled: false
  email:
    enabled: false

# Rule 3 (hardware serialization): one agent run at a time on the shared GPU. Hermes defaults
# to 10 concurrent runs; a second POST /v1/runs gets HTTP 429 and the brainsOS worker backs off
# and resubmits (#295). Enforced on live configs by scripts/setup/apply-hermes-guards.sh.
gateway:
  api_server:
    max_concurrent_runs: 1

display:
  file_mutation_verifier: false
  turn_completion_explainer: false

monitoring:
  install_id: "brainsos-hermes"
  gateway_health_export:
    enabled: false
    metrics_enabled: false
    diagnostic_events_enabled: false
    warning_error_events_enabled: false
    export_interval_seconds: 60
    logs_export_interval_seconds: 0
  export:
    otlp:
      enabled: false


