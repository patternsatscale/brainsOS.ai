name: brainsOS Operator IDE
version: 1.0.0
schema: v1
models:
- name: brainsOS Core (LiteLLM)
  provider: openai
  model: brainsos-core
  apiBase: http://litellm:4000/v1
  apiKey: ${OPERATOR_LITELLM_KEY}
  roles:
  - chat
  - edit
  - apply
- name: Terrastella (Agent API)
  provider: openai
  model: hermes-agent
  apiBase: http://api.terrastella.brainsos.local/v1
  apiKey: ${HERMES_API_TERRASTELLA_KEY}
  roles:
  - chat
- name: Marvin (Agent API)
  provider: openai
  model: hermes-agent
  apiBase: http://api.marvin.brainsos.local/v1
  apiKey: ${HERMES_API_MARVIN_KEY}
  roles:
  - chat
- name: Bawtford (Agent API)
  provider: openai
  model: hermes-agent
  apiBase: http://api.bawtford.brainsos.local/v1
  apiKey: ${HERMES_API_BAWTFORD_KEY}
  roles:
  - chat
