# ==============================================================================
# brainsOS: Appliance Ingress Lockdown Overlay (Ticket #312)
# Enforces strict perimeter isolation for turn-key appliance deployments.
# Unpublishes all internal service ports from host interfaces, ensuring that
# only Caddy on ports 80 and 443 can receive inbound traffic.
# ==============================================================================

services:
  authentik-server:
    ports: !reset []

  clickhouse:
    ports: !reset []

  code-server:
    ports: !reset []

  langfuse-db:
    ports: !reset []

  langfuse-web:
    ports: !reset []

  langfuse-worker:
    ports: !reset []

  litellm:
    ports: !reset []
    environment:
      # Consumed by config/litellm/config.bedrock.yaml (aws_region_name) and boto3.
      # Credentials come from the instance role via IMDSv2; never from .env.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Langfuse host port is unpublished on the appliance: trace in-network (#323).
      LANGFUSE_HOST: http://langfuse-web:3000

  mail-server:
    ports: !reset []

  minio:
    ports: !reset []

  redis:
    ports: !reset []

  runner-claude:
    ports: !reset []

  runner-hermes:
    ports: !reset []
    environment:
      # In-network Langfuse (host port 3001 is unpublished on the appliance, #323)
      HERMES_LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_HOST: http://langfuse-web:3000
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,litellm,mail-server,brainsos-net-mail-server,brainsos-langfuse-web,langfuse,langfuse-web

  runner-openai:
    ports: !reset []

  sogo:
    ports: !reset []

  sogo-db:
    ports: !reset []

  tool-egress-proxy:
    ports: !reset []
