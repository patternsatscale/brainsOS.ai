# ==============================================================================
# brainsOS: Agent Plane (L2 Cognitive Compute & L4 Tool Egress)
# Universal agent runners, warm execution environments, and tool egress proxy
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Hermes Warm Runner (Port 8642)
  runner-hermes:
    build:
      context: ../..
      dockerfile: docker/hermes/Dockerfile
    image: brainsos-hermes-runner:latest
    container_name: brainsos-agent-runner-hermes
    restart: unless-stopped
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${HERMES_RUNNER_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_RUNNER_WEB_PORT:-8787}:9119"
    environment:
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${RUNNER_AUTH_TOKEN:-}
      - RUNNER_AUTH_TOKEN=${RUNNER_AUTH_TOKEN:-}
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_TRUST_REVERSE_PROXY_AUTH=true
      - HERMES_DASHBOARD_PROXY_TOKEN=${HERMES_DASHBOARD_PROXY_TOKEN:-${RUNNER_AUTH_TOKEN:-}}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${BRAINSOS_SUPERUSER_USERNAME:-${BRAINSOS_ADMIN_USERNAME:-admin}}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SESSION_SECRET:-}
      - HERMES_UID=${HERMES_UID:-10001}
      - HERMES_GID=${HERMES_GID:-10001}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${LITELLM_URL:-http://litellm:4000/v1}}
      - OPENAI_API_KEY=${HERMES_LITELLM_KEY:-}
      - LITELLM_API_KEY=${HERMES_LITELLM_KEY:-}
      - LITELLM_URL=${LITELLM_URL:-http://litellm:4000/v1}
      # Third-party tool keys are held in OpenBao & injected in transit by tool-egress-proxy (#387)
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:+in-transit-openbao-managed}
      - TAVILY_API_KEY=${TAVILY_API_KEY:+in-transit-openbao-managed}
      - EXA_API_KEY=${EXA_API_KEY:+in-transit-openbao-managed}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:+in-transit-openbao-managed}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,brainsos-control-litellm,mail-server,brainsos-net-mail-server,lens,brainsos-lens,brainsos-telemetry-lens
      - no_proxy=localhost,127.0.0.1,host.docker.internal,litellm,brainsos-control-litellm,mail-server,brainsos-net-mail-server,lens,brainsos-lens,brainsos-telemetry-lens
      # Write-only LiteLLM Lens OTLP observability (LANGFUSE_SECRET_KEY stripped per #400)
      - BRAINSOS_TELEMETRY_BACKEND=lens
      - LANGFUSE_ENABLED=false
      - LENS_ENABLED=${LENS_ENABLED:-true}
      - LENS_OTLP_ENDPOINT=${LENS_OTLP_ENDPOINT:-http://lens:4318/v1/traces}
      - LITELLM_TRACING_KEY=${LITELLM_TRACING_KEY:-}
      # Tool Egress Proxy CA bundle trust
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      # Safe roots & verifier suppression (Ticket #295)
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/tmp:/workspace:/memories
      - HERMES_FILE_MUTATION_VERIFIER=false
      - HERMES_TURN_COMPLETION_EXPLAINER=false
      - BRAINSOS_LOCAL_DOMAIN=${BRAINSOS_LOCAL_DOMAIN:-${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}}
      - BRAINSOS_MAIL_DOMAIN=${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_LOCAL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}}
      - BRAINSOS_DOMAIN=${BRAINSOS_DOMAIN:-brainsos.local}
    volumes:
      - ${BRAINSOS_HERMES_STATE_DIR:-${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}/hermes/state}:/opt/data
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}/hermes/config.yaml:/opt/data/config.yaml:rw
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}/hermes/config.json:/opt/data/config.json:ro
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}/hermes/model_pool.json:/opt/data/model_pool.json:ro
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}/hermes/mcp.json:/opt/data/mcp.json:ro
      # brainsOS Hermes provider plugins (#295: forwards session_id to LiteLLM Lens traces)
      - ../hermes/plugins/model-providers:/opt/data/plugins/model-providers:ro
      # brainsOS Hermes observability plugin override (#299/#320: mounts plugin.yaml + __init__.py)
      - ../hermes/plugins/observability/langfuse:/opt/hermes/plugins/observability/langfuse:ro
      - ../hermes/01-tool-egress-ca:/etc/cont-init.d/01-tool-egress-ca:ro
      - tool_egress_proxy_data:/etc/ssl/mitmproxy:ro
    command: ["gateway", "run"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-internal-net:
        ipv4_address: ${RUNNER_HERMES_INTERNAL_IP:-172.28.1.20}
        aliases:
          - runner-hermes
          - hermes-runner
          - brainsos-runner-hermes
          - brainsos-agent-runner-hermes
          - brainsos-agent-hermes-runner

  # OpenAI SDK Warm Runner (Port 8002)
  runner-openai:
    build:
      context: ../..
      dockerfile: docker/runners/openai-sdk/Dockerfile
    image: brainsos-runner-openai:latest
    container_name: brainsos-agent-runner-openai
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${OPENAI_RUNNER_PORT:-8002}:8002"
    environment:
      - RUNNER_AUTH_TOKEN=${RUNNER_AUTH_TOKEN:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${LITELLM_URL:-http://litellm:4000/v1}}
      - OPENAI_API_KEY=${OPENAI_SDK_LITELLM_KEY:-}
      - LITELLM_API_KEY=${OPENAI_SDK_LITELLM_KEY:-}
      - LITELLM_URL=${LITELLM_URL:-http://litellm:4000/v1}
      - BRAINSOS_TELEMETRY_BACKEND=lens
      - LENS_ENABLED=${LENS_ENABLED:-true}
      - LANGFUSE_ENABLED=false
      - LENS_OTLP_ENDPOINT=${LENS_OTLP_ENDPOINT:-http://lens:4318/v1/traces}
      - LITELLM_TRACING_KEY=${LITELLM_TRACING_KEY:-}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,mail-server,lens,brainsos-lens,brainsos-telemetry-lens
      - no_proxy=localhost,127.0.0.1,host.docker.internal,litellm,mail-server,lens,brainsos-lens,brainsos-telemetry-lens
    volumes:
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}:/data/runners:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-internal-net:
        ipv4_address: ${RUNNER_OPENAI_INTERNAL_IP:-172.28.1.21}
        aliases:
          - runner-openai
          - brainsos-runner-openai
          - brainsos-agent-runner-openai

  # Claude SDK Warm Runner (Port 8001)
  runner-claude:
    build:
      context: ../..
      dockerfile: docker/runners/claude-sdk/Dockerfile
    image: brainsos-runner-claude:latest
    container_name: brainsos-agent-runner-claude
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${CLAUDE_RUNNER_PORT:-8001}:8001"
    environment:
      - RUNNER_AUTH_TOKEN=${RUNNER_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://litellm:4000}
      - ANTHROPIC_API_KEY=${CLAUDE_SDK_LITELLM_KEY:-}
      - LITELLM_API_KEY=${CLAUDE_SDK_LITELLM_KEY:-}
      - LITELLM_URL=${LITELLM_URL:-http://litellm:4000}
      - BRAINSOS_TELEMETRY_BACKEND=lens
      - LENS_ENABLED=${LENS_ENABLED:-true}
      - LANGFUSE_ENABLED=false
      - LENS_OTLP_ENDPOINT=${LENS_OTLP_ENDPOINT:-http://lens:4318/v1/traces}
      - LITELLM_TRACING_KEY=${LITELLM_TRACING_KEY:-}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,mail-server,lens,brainsos-lens,brainsos-telemetry-lens
      - no_proxy=localhost,127.0.0.1,host.docker.internal,litellm,mail-server,lens,brainsos-lens,brainsos-telemetry-lens
    volumes:
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-../../data}/runners}:/data/runners:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-internal-net:
        ipv4_address: ${RUNNER_CLAUDE_INTERNAL_IP:-172.28.1.22}
        aliases:
          - runner-claude
          - brainsos-runner-claude
          - brainsos-agent-runner-claude

  # Tool Egress Gateway & Inspection Proxy (mitmproxy / mitmweb)
  tool-egress-proxy:
    build:
      context: ../..
      dockerfile: docker/egress/Dockerfile
    image: brainsos-net-egress-proxy:latest
    container_name: brainsos-agent-egress-proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${TOOL_EGRESS_WEB_PORT:-8081}:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - TOOL_EGRESS_WEB_PASSWORD=${TOOL_EGRESS_WEB_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-}}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-https://openbao:8200}
      - OPENBAO_CACERT=${OPENBAO_CACERT:-/etc/ssl/openbao/ca.crt}
      - OPENBAO_APPROLE_ENV=/run/secrets/openbao/egress-approle.env
      - OPENBAO_ROLE_ID=${OPENBAO_ROLE_ID:-}
      - OPENBAO_SECRET_ID=${OPENBAO_SECRET_ID:-}
      - TOOL_EGRESS_ALLOWED_CONTAINERS=${TOOL_EGRESS_ALLOWED_CONTAINERS:-runner-hermes,runner-openai,runner-claude}
      - TOOL_EGRESS_PROXY_TOKENS=${TOOL_EGRESS_PROXY_TOKENS:-}
      - TOOL_EGRESS_PROXY_SECRET=${TOOL_EGRESS_PROXY_SECRET:-}
      - GITHUB_ALLOWED_REPOS=${GITHUB_ALLOWED_REPOS:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
    command: >
      mitmweb --web-host 0.0.0.0 --web-port 8081 --listen-port 8082 --set block_global=false --set web_password=${TOOL_EGRESS_WEB_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-}} --no-web-open-browser -s /addons/theme_loader.py -s /addons/github_auth.py
    volumes:
      - tool_egress_proxy_data:/home/mitmproxy/.mitmproxy
      - ../../config/egress/addons:/addons:ro
      - ../../config/egress/theme:/theme:ro
      - ${BRAINSOS_OPENBAO_APPROLE_DIR:-${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane}/openbao_approle}:/run/secrets/openbao:ro
      - ${BRAINSOS_OPENBAO_TLS_DIR:-${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane}/openbao_tls}/ca.crt:/etc/ssl/openbao/ca.crt:ro
    networks:
      brainsos-secrets-net:
        ipv4_address: ${TOOL_EGRESS_SECRETS_IP:-172.28.4.10}
      brainsos-internal-net:
        ipv4_address: ${TOOL_EGRESS_INTERNAL_IP:-172.28.1.2}
        gw_priority: 100
        aliases:
          - brainsos-net-egress-proxy
          - brainsos-tool-egress-proxy
          - brainsos-agent-egress-proxy
          - tool-egress-proxy
          - efw
          - firewall

  # Inbound Email Ingress Daemon (AWS SQS/S3 -> Postfix)
  mail-ingress:
    profiles:
      - mail-ingress
    build:
      context: ../..
      dockerfile: docker/mail/Dockerfile.ingress
    image: brainsos-mail-ingress:latest
    container_name: brainsos-agent-mail-ingress
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mail-server:
        condition: service_healthy
    networks:
      brainsos-internal-net:
        ipv4_address: ${MAIL_INGRESS_INTERNAL_IP:-172.28.1.23}
        aliases:
          - brainsos-net-mail-ingress
          - brainsos-mail-ingress
          - brainsos-agent-mail-ingress
          - mail-ingress
    environment:
      - AWS_REGION=${BRAINSOS_INFRA_AWS_REGION:-${AWS_REGION:-us-east-1}}
      - AWS_ACCESS_KEY_ID=${INGRESS_AWS_ACCESS_KEY_ID:-${BRAINSOS_INFRA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}}
      - AWS_SECRET_ACCESS_KEY=${INGRESS_AWS_SECRET_ACCESS_KEY:-${BRAINSOS_INFRA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}}
      - INGRESS_AWS_ACCESS_KEY_ID=${INGRESS_AWS_ACCESS_KEY_ID:-}
      - INGRESS_AWS_SECRET_ACCESS_KEY=${INGRESS_AWS_SECRET_ACCESS_KEY:-}
      - INGRESS_QUEUE_URL=${INGRESS_QUEUE_URL:-}
      - INGRESS_S3_BUCKET=${INGRESS_S3_BUCKET:-${INGRESS_BUCKET_NAME:-}}
      - INGRESS_BUCKET_NAME=${INGRESS_BUCKET_NAME:-${INGRESS_S3_BUCKET:-}}
      - LOCAL_SMTP_HOST=mail
      - LOCAL_SMTP_PORT=25
      - LOCAL_SMTP_USERNAME=${LOCAL_SMTP_USERNAME:-admin@${BRAINSOS_LOCAL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}}
      - LOCAL_SMTP_PASSWORD=${LOCAL_SMTP_PASSWORD:-${ADMIN_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-}}}
      - INGRESS_POLL_WAIT_SECONDS=${INGRESS_POLL_WAIT_SECONDS:-20}
      - INGRESS_MAX_MESSAGES=${INGRESS_MAX_MESSAGES:-5}
    logging: *default-logging

volumes:
  tool_egress_proxy_data:
    name: brainsos_tool_egress_proxy_data

