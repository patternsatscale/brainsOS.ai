# ==============================================================================
# brainsOS: Control Plane (L4 Routing, Security & Dynamic Model Registry)
# LiteLLM proxy gateway and dedicated isolated persistence store
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Dedicated PostgreSQL Database for LiteLLM Control Plane
  # Rule 6 Hardening: Host port binding removed; accessible exclusively over brainsos-control-net
  litellm-db:
    image: postgres:16-alpine
    container_name: brainsos-control-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}
    volumes:
      - ${LITELLM_DB_DATA_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane/litellm_db}:/var/lib/postgresql/data
    networks:
      brainsos-control-net:
        ipv4_address: ${LITELLM_DB_CONTROL_IP:-172.28.2.20}
        aliases:
          - litellm-db
          - brainsos-infra-litellm-db
          - brainsos-control-litellm-db
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          pg_isready -U "$${POSTGRES_USER:-litellm}" || exit 1;
          psql -U "$${POSTGRES_USER:-litellm}" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$${POSTGRES_DB:-litellm}'" | grep -q 1 || createdb -U "$${POSTGRES_USER:-litellm}" "$${POSTGRES_DB:-litellm}";
          psql -U "$${POSTGRES_USER:-litellm}" -d postgres -c "ALTER USER \"$${POSTGRES_USER:-litellm}\" WITH PASSWORD '$${POSTGRES_PASSWORD}';"
      interval: 5s
      timeout: 5s
      retries: 5

  # Control Plane Gateway: Containerized LiteLLM Proxy
  # Rule 2: Routes completions to host Ollama (http://host.docker.internal:11434)
  # Rule 6: Strictly isolated database access over brainsos-control-net
  litellm:
    image: ghcr.io/berriai/litellm-database:${LITELLM_IMAGE_TAG:-v1.109.1}
    container_name: brainsos-control-litellm
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:${DOCKER_HOST_GATEWAY:-host-gateway}"
    volumes:
      - ${LITELLM_CONFIG:-../../config/litellm/config.yaml}:/app/config.yaml:ro
      - ../../docker/litellm/patches/langfuse_otel.py:/app/.venv/lib/python3.13/site-packages/litellm/integrations/langfuse/langfuse_otel.py:ro
    environment:
      - PORT=4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      - DATABASE_URL=postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}@litellm-db:5432/${LITELLM_DB_NAME:-litellm}
      - STORE_MODEL_IN_DB=True
      - BRAINSOS_CORE_MODEL=${BRAINSOS_CORE_MODEL:-ollama_chat/llama3.2:3b}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # Authentik OIDC Single Sign-On
      - AUTO_REDIRECT_UI_LOGIN_TO_SSO=true
      - PROXY_BASE_URL=https://${BRAINSOS_DOMAIN:-brainsos.local}
      - PROXY_ADMIN_ID=${LITELLM_PROXY_ADMIN_ID:-${BRAINSOS_SUPERUSER_USERNAME:-admin}}
      - LITELLM_PROXY_ADMIN_NAME=${BRAINSOS_SUPERUSER_EMAIL:-${BRAINSOS_ADMIN_EMAIL:-admin@${BRAINSOS_DOMAIN:-brainsos.local}}}
      - PROXY_ADMIN_EMAILS=admin@${BRAINSOS_LOCAL_DOMAIN:-dgx.local.brainsos.ai},admin@brainsos.ai,operator@${BRAINSOS_LOCAL_DOMAIN:-dgx.local.brainsos.ai},${BRAINSOS_SUPERUSER_EMAIL:-admin@brainsos.ai}
      - GENERIC_CLIENT_ID=${AUTH_LITELLM_CLIENT_ID:-litellm-proxy}
      - GENERIC_CLIENT_SECRET=${AUTH_LITELLM_CLIENT_SECRET:?AUTH_LITELLM_CLIENT_SECRET must be set}
      - GENERIC_AUTHORIZATION_ENDPOINT=https://${BRAINSOS_DOMAIN:-brainsos.local}/application/o/authorize/
      - GENERIC_TOKEN_ENDPOINT=http://authentik-server:9000/application/o/token/
      - GENERIC_USERINFO_ENDPOINT=http://authentik-server:9000/application/o/userinfo/
      - GENERIC_USER_ID_ATTRIBUTE=preferred_username
      - GENERIC_INCLUDE_TOKEN_CLAIMS=true
      - GENERIC_ROLE_MAPPINGS_GROUP_CLAIM=groups
      - GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE=${AUTH_LITELLM_DEFAULT_ROLE:-internal_user_viewer}
      - "GENERIC_ROLE_MAPPINGS_ROLES={'proxy_admin': ['authentik Admins', 'admins', 'admin', 'appliance-admins']}"
      # Vendor-neutral OpenTelemetry & Langfuse Observability Tracing (#299 / #375 / #382)
      - BRAINSOS_TELEMETRY_BACKEND=${BRAINSOS_TELEMETRY_BACKEND:-dual}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_HOST=${LITELLM_LANGFUSE_HOST:-http://host.docker.internal:3001}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_EXPORTER_OTLP_HEADERS=x-langfuse-ingestion-version=4
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=x-langfuse-ingestion-version=4
      # First-Class LiteLLM Lens Observability Integration (#375)
      - LITELLM_LENS_URL=${LITELLM_LENS_URL:-http://lens:4318}
      - LITELLM_LENS_PUBLIC_URL=${LITELLM_LENS_PUBLIC_URL:-https://${BRAINSOS_DOMAIN:-brainsos.local}/lens-ingest}
      - LITELLM_LENS_SERVICE_TOKEN=${LITELLM_LENS_SERVICE_TOKEN:?LITELLM_LENS_SERVICE_TOKEN must be set}
      - LENS_GATEWAY_SECRET=${LENS_GATEWAY_SECRET:?LENS_GATEWAY_SECRET must be set}
    networks:
      brainsos-control-net:
        ipv4_address: ${LITELLM_CONTROL_IP:-172.28.2.10}
        gw_priority: 100
      brainsos-ingress-net:
        ipv4_address: ${LITELLM_INGRESS_IP:-172.28.0.11}
        aliases:
          - litellm
          - brainsos-litellm
          - brainsos-infra-litellm
          - brainsos-control-litellm
    logging: *default-logging
    depends_on:
      litellm-db:
        condition: service_healthy
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0", "--num_workers", "1" ]
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveness\")'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Minimal Zero-Secret Read-Only L7 Sandbox Inference & OTLP Gateway (#406 HIGH-4)
  # Mediates brainsos-sandbox-net (and warm runners on brainsos-internal-net) -> litellm:4000 / lens:4318
  sandbox-gateway:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: brainsos-sandbox-gateway
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ../../config/sandbox-gateway:/etc/caddy:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    networks:
      brainsos-sandbox-net:
        ipv4_address: ${SANDBOX_GATEWAY_SANDBOX_IP:-172.28.8.10}
        aliases:
          - sandbox-gateway
          - brainsos-sandbox-gateway
          - litellm
          - brainsos-litellm
          - brainsos-infra-litellm
          - brainsos-control-litellm
          - lens
          - brainsos-lens
          - brainsos-telemetry-lens
      brainsos-ingress-net:
        ipv4_address: ${SANDBOX_GATEWAY_INGRESS_IP:-172.28.0.19}
        aliases:
          - sandbox-gateway
          - brainsos-sandbox-gateway
      brainsos-internal-net:
        ipv4_address: ${SANDBOX_GATEWAY_INTERNAL_IP:-172.28.1.14}
        aliases:
          - sandbox-gateway
          - brainsos-sandbox-gateway
          - litellm
          - brainsos-litellm
          - brainsos-infra-litellm
          - brainsos-control-litellm
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000 && nc -z 127.0.0.1 4318"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Segregated OpenBao Secret Manager (Integrated Raft Storage, Zero Host Ports - #387)
  openbao:
    image: quay.io/openbao/openbao:${OPENBAO_IMAGE_TAG:-2.2.0}
    container_name: brainsos-control-secrets
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    environment:
      - BAO_ADDR=https://127.0.0.1:8200
      - BAO_CACERT=/openbao/tls/ca.crt
      - HOME=/openbao/data
    volumes:
      - ../../config/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ${BRAINSOS_OPENBAO_DATA_DIR:-${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane}/openbao}:/openbao/data
      - ${BRAINSOS_OPENBAO_TLS_DIR:-${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane}/openbao_tls}:/openbao/tls:ro
      - ${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-../../data}/control_plane}/caddy_root.crt:/etc/ssl/caddy/root.crt:ro
    networks:
      brainsos-control-net:
        ipv4_address: ${OPENBAO_CONTROL_IP:-172.28.2.11}
        aliases:
          - openbao
          - secrets
          - brainsos-control-secrets
      brainsos-secrets-net:
        ipv4_address: ${OPENBAO_SECRETS_IP:-172.28.4.11}
        aliases:
          - openbao
          - secrets
          - brainsos-control-secrets
      brainsos-ingress-net:
        ipv4_address: ${OPENBAO_INGRESS_IP:-172.28.0.13}
        aliases:
          - openbao
          - brainsos-openbao
          - brainsos-control-secrets
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "SSL_CERT_FILE=/openbao/tls/ca.crt wget -q -S -O /dev/null https://127.0.0.1:8200/v1/sys/health 2>&1 | awk '/^  HTTP\\// {print $2}' | grep -Eq '^(200|429|472|473|501|503)$'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
