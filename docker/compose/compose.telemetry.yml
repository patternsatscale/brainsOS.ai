# ==============================================================================
# brainsOS: Telemetry Plane (Observability & Distributed Tracing Stack)
# Langfuse v4.38.0 Web/Worker with ClickHouse OLAP, Redis, MinIO & PostgreSQL
# ==============================================================================

services:
  # Langfuse Web & API Server
  # Ingests OpenTelemetry traces (/api/public/otel) and LiteLLM completions
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4.58.0}
    container_name: brainsos-telemetry-langfuse-web
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD must be set}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://${BRAINSOS_DOMAIN:-local.brainsos.ai}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - SALT=${SALT:?SALT must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - LANGFUSE_MIGRATION_V4_WRITE_MODE=${LANGFUSE_MIGRATION_V4_WRITE_MODE:-dual}
      - LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR=${LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR:-direct}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NODE_EXTRA_CA_CERTS=/etc/ssl/caddy/root.crt
      # Native Authentik OIDC Single Sign-On
      - AUTH_CUSTOM_CLIENT_ID=${AUTH_LANGFUSE_CLIENT_ID:-langfuse-trace}
      - AUTH_CUSTOM_CLIENT_SECRET=${AUTH_LANGFUSE_CLIENT_SECRET:?AUTH_LANGFUSE_CLIENT_SECRET must be set}
      - AUTH_CUSTOM_ISSUER=${AUTH_LANGFUSE_ISSUER:-https://${BRAINSOS_DOMAIN:-local.brainsos.ai}/application/o/langfuse}
      - AUTH_CUSTOM_NAME=brainsOS SSO
      - AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING=false
      - AUTH_CUSTOM_FETCH_USERINFO=true
      - AUTH_DISABLE_USERNAME_PASSWORD=true
      # ClickHouse OLAP Analytics Store
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_CLUSTER_NAME=default
      # Redis Ingestion Queue & Cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:?REDIS_AUTH must be set}
      # MinIO / S3 Event & Media Object Store
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://localhost:9090}
      - LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # Declarative Zero-Click Auto-Provisioning
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-brainsos}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-brainsOS}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-brainsos}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-brainsOS Fleet}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-${BRAINSOS_ADMIN_EMAIL:-admin@brainsos.local}}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-brainsOS Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:?BRAINSOS_ADMIN_PASSWORD or LANGFUSE_INIT_USER_PASSWORD must be set}}
      # Outbound LLM Connection Whitelist
      - LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=proxy.brainsos.local,api.terrastella.brainsos.local,api.marvin.brainsos.local,api.bawtford.brainsos.local,api.cindypawford.brainsos.local,host.docker.internal,litellm,localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
      - "proxy.brainsos.local:host-gateway"
      - "api.terrastella.brainsos.local:host-gateway"
      - "api.marvin.brainsos.local:host-gateway"
      - "api.bawtford.brainsos.local:host-gateway"
      - "api.cindypawford.brainsos.local:host-gateway"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${LANGFUSE_TELEMETRY_IP:-172.28.7.10}
        aliases:
          - langfuse-web
          - brainsos-langfuse-web
          - brainsos-telemetry-langfuse-web
      brainsos-ingress-net:
        ipv4_address: ${LANGFUSE_INGRESS_IP:-172.28.0.16}
        aliases:
          - langfuse-web
          - brainsos-telemetry-langfuse-web
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Langfuse Background Asynchronous Worker
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4.58.0}
    container_name: brainsos-telemetry-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD must be set}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - SALT=${SALT:?SALT must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - LANGFUSE_MIGRATION_V4_WRITE_MODE=${LANGFUSE_MIGRATION_V4_WRITE_MODE:-dual}
      # #299: write OTLP spans directly to the v4 events table even without the
      # x-langfuse-ingestion-version: 4 header (Hermes' SDK exporter omits it).
      - LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR=${LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR:-direct}
      - NODE_ENV=production
      # ClickHouse OLAP Analytics Store
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_CLUSTER_NAME=default
      # Redis Ingestion Queue & Cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:?REDIS_AUTH must be set}
      # MinIO / S3 Event & Media Object Store
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # Outbound LLM Connection Whitelist
      - LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=proxy.brainsos.local,api.terrastella.brainsos.local,api.marvin.brainsos.local,api.bawtford.brainsos.local,api.cindypawford.brainsos.local,host.docker.internal,litellm,localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
      - "proxy.brainsos.local:host-gateway"
      - "api.terrastella.brainsos.local:host-gateway"
      - "api.marvin.brainsos.local:host-gateway"
      - "api.bawtford.brainsos.local:host-gateway"
      - "api.cindypawford.brainsos.local:host-gateway"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${LANGFUSE_WORKER_TELEMETRY_IP:-172.28.7.12}
        aliases:
          - langfuse-worker
          - brainsos-langfuse-worker
          - brainsos-telemetry-langfuse-worker

  # ClickHouse OLAP Columnar Store (Shared by Langfuse default DB & isolated Lens DB + KeeperMap)
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    container_name: brainsos-telemetry-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ${LANGFUSE_CLICKHOUSE_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-${BRAINSOS_DATA_DIR:-../../data}/telemetry}/clickhouse}:/var/lib/clickhouse
      - ../../config/clickhouse/lens-keeper.xml:/etc/clickhouse-server/config.d/lens-keeper.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${CLICKHOUSE_TELEMETRY_IP:-172.28.7.20}
        aliases:
          - clickhouse
          - brainsos-langfuse-clickhouse
          - brainsos-telemetry-clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  # LiteLLM Lens Observability Service (Embedded Gateway UI, OTLP Ingestion & Spend Matching)
  # Rootless (65532:65532), read-only rootfs, isolated ClickHouse database (`lens`) + KeeperMap
  lens:
    build:
      context: ../..
      dockerfile: docker/lens/Dockerfile
    image: brainsos-lens:latest
    container_name: brainsos-telemetry-lens
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${LENS_TMP_SIZE:-1g}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LENS_PORT:-4318}:4318"
    environment:
      - LENS_MODE=standalone
      - LENS_ADMIN_TOKEN=${LENS_ADMIN_TOKEN:?LENS_ADMIN_TOKEN must be set}
      - LENS_GATEWAY_URL=${LENS_GATEWAY_URL:-http://litellm:4000}
      - LENS_GATEWAY_SECRET=${LENS_GATEWAY_SECRET:?LENS_GATEWAY_SECRET must be set}
      - LENS_GATEWAY_API_BASE=${LENS_GATEWAY_API_BASE:-http://litellm:4000}
      - LENS_GATEWAY_API_KEY=${LENS_GATEWAY_API_KEY:-${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY or LENS_GATEWAY_API_KEY must be set}}
      - LITELLM_LENS_SERVICE_TOKEN=${LITELLM_LENS_SERVICE_TOKEN:?LITELLM_LENS_SERVICE_TOKEN must be set}
      - LENS_PUBLIC_URL=https://${BRAINSOS_DOMAIN:-local.brainsos.ai}
      - LITELLM_LENS_PUBLIC_URL=${LITELLM_LENS_PUBLIC_URL:-https://${BRAINSOS_DOMAIN:-local.brainsos.ai}/lens-ingest}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=${LENS_CLICKHOUSE_USER:-lens}
      - CLICKHOUSE_PASSWORD=${LENS_CLICKHOUSE_PASSWORD:?LENS_CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_DATABASE=${LENS_CLICKHOUSE_DB:-lens}
      - AGENT_TRACING_RETENTION_DAYS=${AGENT_TRACING_RETENTION_DAYS:-14}
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${LENS_TELEMETRY_IP:-172.28.7.11}
        aliases:
          - lens
          - brainsos-lens
          - brainsos-telemetry-lens
      brainsos-internal-net:
        ipv4_address: ${LENS_INTERNAL_IP:-172.28.1.13}
        aliases:
          - lens
          - brainsos-lens
          - brainsos-telemetry-lens
      brainsos-ingress-net:
        ipv4_address: ${LENS_INGRESS_IP:-172.28.0.17}
        aliases:
          - lens
          - brainsos-telemetry-lens
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4318/health/ready" ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  # Redis Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: brainsos-telemetry-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_AUTH:?REDIS_AUTH must be set} --maxmemory-policy noeviction
    volumes:
      - ${LANGFUSE_REDIS_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-${BRAINSOS_DATA_DIR:-../../data}/telemetry}/redis}:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${REDIS_TELEMETRY_IP:-172.28.7.21}
        aliases:
          - redis
          - brainsos-langfuse-redis
          - brainsos-telemetry-redis
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_AUTH:?REDIS_AUTH must be set} ping | grep -q PONG || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 10

  # MinIO Object Storage (S3-Compatible)
  minio:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    container_name: brainsos-telemetry-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - ${LANGFUSE_MINIO_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-${BRAINSOS_DATA_DIR:-../../data}/telemetry}/minio}:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9090}:9000"
      - "127.0.0.1:9091:9001"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${MINIO_TELEMETRY_IP:-172.28.7.22}
        aliases:
          - minio
          - brainsos-langfuse-minio
          - brainsos-telemetry-minio
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/9000)' || exit 1" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  # Langfuse Dedicated Persistence: PostgreSQL Database
  langfuse-db:
    image: postgres:16-alpine
    container_name: brainsos-telemetry-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD must be set}
    volumes:
      - ${LANGFUSE_DB_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-${BRAINSOS_DATA_DIR:-../../data}/telemetry}/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LANGFUSE_DB_PORT:-5433}:5432"
    networks:
      brainsos-telemetry-net:
        ipv4_address: ${LANGFUSE_DB_TELEMETRY_IP:-172.28.7.23}
        aliases:
          - langfuse-db
          - brainsos-langfuse-db
          - brainsos-telemetry-langfuse-db
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          pg_isready -U "$${POSTGRES_USER:-langfuse}" || exit 1;
          psql -U "$${POSTGRES_USER:-langfuse}" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$${POSTGRES_DB:-langfuse}'" | grep -q 1 || createdb -U "$${POSTGRES_USER:-langfuse}" "$${POSTGRES_DB:-langfuse}";
          psql -U "$${POSTGRES_USER:-langfuse}" -d postgres -c "ALTER USER \"$${POSTGRES_USER:-langfuse}\" WITH PASSWORD '$${POSTGRES_PASSWORD}';"
      interval: 5s
      timeout: 5s
      retries: 5
