# ==============================================================================
# brainsOS: SOGo In-Container Web Server & Static Asset Dispatcher
# Serves SOGo WebServerResources (CSS, JS, fonts, images) and reverse proxies
# dynamic application and CalDAV requests to sogod on 127.0.0.1:20001.
# ==============================================================================

server {
    listen 20000 default_server;
    listen [::]:20000 default_server;
    server_name _;

    root /usr/lib/GNUstep/SOGo/WebServerResources;

    # Zero-delay redirect to SOGo web interface
    location = / {
        rewrite ^ /SOGo permanent;
    }

    # SOGo Static WebServerResources (CSS, JS, Icons, Images, Themes)
    location ^~ /SOGo.woa/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }

    location ^~ /SOGo/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }

    location ^~ /SOGo/so/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
        expires max;
    }

    # Dynamic SOGo Webmail & CalDAV Application Engine
    location ^~ /SOGo {
        proxy_pass http://127.0.0.1:20001;
        proxy_redirect http://127.0.0.1:20001/ /;
        proxy_redirect http://sogo:20000/ /;
        proxy_redirect ^http://(.*) https://$1;
        proxy_redirect default;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";

        # Inject brainsOS Obsidian Dark Theme into HTML
        sub_filter '</head>' '<link href="/SOGo.woa/WebServerResources/css/theme-brainsos.css" rel="stylesheet" type="text/css" /></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        # WebObjects (SOPE/SOGo) routing headers
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host 127.0.0.1;
        set $sogo_user $http_x_webobjects_remote_user;
        if ($sogo_user = "") {
            set $sogo_user $http_x_authentik_username;
        }
        if ($sogo_user = "") {
            set $sogo_user $http_remote_user;
        }
        if ($sogo_user = "akadmin") {
            set $sogo_user "admin";
        }
        proxy_set_header x-webobjects-remote-user $sogo_user;

        set $sogo_srv_name $http_x_webobjects_server_name;
        if ($sogo_srv_name = "") {
            set $sogo_srv_name $server_name;
        }
        proxy_set_header x-webobjects-server-name $sogo_srv_name;

        set $sogo_srv_url $http_x_webobjects_server_url;
        if ($sogo_srv_url = "") {
            set $sogo_srv_url $scheme://$http_host;
        }
        proxy_set_header x-webobjects-server-url $sogo_srv_url;

        set $sogo_srv_port $http_x_webobjects_server_port;
        if ($sogo_srv_port = "") {
            set $sogo_srv_port $server_port;
        }
        proxy_set_header x-webobjects-server-port $sogo_srv_port;

        # Buffer sizing for large headers and calendar payloads
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        client_max_body_size 50m;
        client_body_buffer_size 128k;
    }
}
