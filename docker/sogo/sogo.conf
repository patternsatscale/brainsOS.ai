{
  /* ********************* Main SOGo Configuration File **********************
   * Project Titan: Layer 7 Communications & Groupware Plane                *
   * Replaces SnappyMail with SOGo for Webmail, Multi-Agent CalDAV, and    *
   * Scheduled Event Alarms (Ticket #166).                                   *
   * *********************************************************************** */

  /* Database Configuration (Dedicated & Isolated titan-sogo-db) */
  SOGoProfileURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_user_profile";
  OCSFolderInfoURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_folder_info";
  OCSSessionsFolderURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_sessions_folder";
  OCSAdminURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_admin";
  OCSEMailAlarmsFolderURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_alarms_folder";

  /* Memcached (Local in-container daemon) */
  SOGoMemcachedHost = "127.0.0.1";

  /* Mail Configuration */
  SOGoDraftsFolderName = "Drafts";
  SOGoSentFolderName = "Sent";
  SOGoTrashFolderName = "Trash";
  SOGoJunkFolderName = "Junk";
  SOGoIMAPServer = "mail-server";
  SOGoSMTPServer = "mail-server";
  SOGoMailingMechanism = "smtp";
  SOGoMailDomain = "titan.local";
  SOGoForceExternalLoginWithEmail = YES;

  /* Calendar Event Reminders & Alarm Notifications */
  SOGoEnableEMailAlarms = YES;
  SOGoEMailAlarmsEnabled = YES;
  SOGoAppointmentSendEMailNotifications = YES;

  /* Authentication Source (SQL User Database) */
  SOGoUserSources = (
    {
      type = sql;
      id = users;
      viewURL = "postgresql://sogo:sogo_secret_pass@titan-sogo-db:5432/sogo/sogo_users";
      canAuthenticate = YES;
      isAddressBook = YES;
      userPasswordAlgorithm = plain;
      IMAPLoginFieldName = "mail";
      MailFieldNames = ("mail");
      UIDFieldName = "c_uid";
    }
  );

  /* Web Server & Listening Parameters */
  WOPort = "127.0.0.1:20001";
  SOGoTimeZone = "UTC";
  SOGoLanguage = English;
  SOGoCalendarDefaultRoles = (
    "PublicViewer",
    "ConfidentialDAndTViewer"
  );
  SOGoTrustProxyAuthentication = NO;
  Imap4DebugEnabled = YES;
}
