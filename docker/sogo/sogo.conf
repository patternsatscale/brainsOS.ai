{
  /* ********************* Main SOGo Configuration File **********************
   * brainsOS: Layer 7 Communications & Groupware Plane                     *
   * SOGo for Webmail, Multi-Agent CalDAV, and Scheduled Event Alarms.       *
   * *********************************************************************** */

  /* Database Configuration (Dedicated & Isolated brainsos-sogo-db) */
  SOGoProfileURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_user_profile";
  OCSFolderInfoURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_folder_info";
  OCSSessionsFolderURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_sessions_folder";
  OCSAdminURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_admin";
  OCSEMailAlarmsFolderURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_alarms_folder";

  /* Memcached (Local in-container daemon) */
  SOGoMemcachedHost = "127.0.0.1";

  /* Mail Configuration */
  SOGoDraftsFolderName = "Drafts";
  SOGoSentFolderName = "Sent";
  SOGoTrashFolderName = "Trash";
  SOGoJunkFolderName = "Junk";
  SOGoIMAPServer = "mail-server";
  SOGoSMTPServer = "mail-server";
  SOGoMailingMechanism = "smtp";
  SOGoMailDomain = "__SOGO_MAIL_DOMAIN__";
  SOGoForceExternalLoginWithEmail = NO;

  /* Calendar Event Reminders & Alarm Notifications */
  SOGoEnableEMailAlarms = YES;
  SOGoEMailAlarmsEnabled = YES;
  SOGoAppointmentSendEMailNotifications = YES;

  /* Authentication Source & Global Address Book (SQL User Database) */
  SOGoUserSources = (
    {
      type = sql;
      id = users;
      viewURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_users";
      canAuthenticate = YES;
      isAddressBook = NO;
      userPasswordAlgorithm = sha512-crypt;
      IMAPLoginFieldName = "mail";
      MailFieldNames = ("mail");
      UIDFieldName = "c_uid";
    },
    {
      type = sql;
      id = directory;
      displayName = "brainsOS Directory";
      viewURL = "postgresql://__SOGO_DB_USER__:__SOGO_DB_PASSWORD__@__SOGO_DB_HOST__:__SOGO_DB_PORT__/__SOGO_DB_NAME__/sogo_addressbook";
      canAuthenticate = NO;
      isAddressBook = YES;
      MailFieldNames = ("mail");
      UIDFieldName = "c_uid";
    }
  );

  /* Web Server & Listening Parameters */
  WOPort = "127.0.0.1:20001";
  SOGoTimeZone = "UTC";
  SOGoLanguage = English;
  SOGoCalendarDefaultRoles = (
    "PublicViewer",
    "ConfidentialDAndTViewer"
  );
  SOGoTrustProxyAuthentication = YES;
  SOGoLoginModule = Mail;
  Imap4DebugEnabled = YES;
  SOGoUIAdditionalJSFiles = (
    "js/theme-brainsos.js"
  );
}
