# ==============================================================================
# brainsOS: Observability Plane (Langfuse v4.38.0 Distributed Stack)
# High-performance distributed tracing with ClickHouse, Redis, MinIO & Postgres
# ==============================================================================

name: brainsos-langfuse

services:
  # ----------------------------------------------------------------------------
  # Langfuse Web & API Server
  # Ingests OpenTelemetry traces (/api/public/otel) and LiteLLM completions
  # ----------------------------------------------------------------------------
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.38.0
    container_name: brainsos-langfuse-web
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-brainsos_langfuse_secret_change_me}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://langfuse.${BRAINSOS_DOMAIN:-local.brainsos.ai}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-brainsos_langfuse_nextauth_secret_must_be_set_32_chars}
      - SALT=${SALT:-brainsos_langfuse_salt_secret_must_be_set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - LANGFUSE_MIGRATION_V4_WRITE_MODE=${LANGFUSE_MIGRATION_V4_WRITE_MODE:-dual}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Native Authentik OIDC Single Sign-On
      - AUTH_CUSTOM_CLIENT_ID=${AUTH_LANGFUSE_CLIENT_ID:-langfuse-trace}
      - AUTH_CUSTOM_CLIENT_SECRET=${AUTH_LANGFUSE_CLIENT_SECRET:-brainsos_langfuse_secret}
      - AUTH_CUSTOM_ISSUER=${AUTH_LANGFUSE_ISSUER:-https://${BRAINSOS_DOMAIN:-local.brainsos.ai}/application/o/langfuse}
      - AUTH_CUSTOM_NAME=brainsOS SSO
      - AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING=true
      - AUTH_CUSTOM_FETCH_USERINFO=true
      - AUTH_DISABLE_USERNAME_PASSWORD=true
      # ClickHouse OLAP Analytics Store
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_CLUSTER_NAME=default
      # Redis Ingestion Queue & Cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:-myredissecret}
      # MinIO / S3 Event & Media Object Store
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://localhost:9090}
      - LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # Declarative Zero-Click Auto-Provisioning
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-brainsos}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-brainsOS}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-brainsos}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-brainsOS Fleet}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-${BRAINSOS_ADMIN_EMAIL:-admin@brainsos.local}}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-brainsOS Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_secret}}
      # Outbound LLM Connection Whitelist (allows reaching LiteLLM and Agents via Caddy)
      - LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=proxy.brainsos.local,api.terrastella.brainsos.local,api.marvin.brainsos.local,api.bawtford.brainsos.local,api.cindypawford.brainsos.local,host.docker.internal,litellm,localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
      - "${BRAINSOS_DOMAIN:-local.brainsos.ai}:host-gateway"
      - "local.brainsos.ai:host-gateway"
      - "proxy.brainsos.local:host-gateway"
      - "api.terrastella.brainsos.local:host-gateway"
      - "api.marvin.brainsos.local:host-gateway"
      - "api.bawtford.brainsos.local:host-gateway"
      - "api.cindypawford.brainsos.local:host-gateway"
    networks:
      - langfuse-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Langfuse Background Asynchronous Worker
  # Processes trace ingestion queues from Redis and flushes to ClickHouse
  # ----------------------------------------------------------------------------
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.38.0
    container_name: brainsos-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-brainsos_langfuse_secret_change_me}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - SALT=${SALT:-brainsos_langfuse_salt_secret_must_be_set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - LANGFUSE_MIGRATION_V4_WRITE_MODE=${LANGFUSE_MIGRATION_V4_WRITE_MODE:-dual}
      - NODE_ENV=production
      # ClickHouse OLAP Analytics Store
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - CLICKHOUSE_CLUSTER_NAME=default
      # Redis Ingestion Queue & Cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_AUTH:-myredissecret}
      # MinIO / S3 Event & Media Object Store
      - LANGFUSE_USE_AZURE_BLOB=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
      # Outbound LLM Connection Whitelist (allows reaching LiteLLM and Agents via Caddy)
      - LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=proxy.brainsos.local,api.terrastella.brainsos.local,api.marvin.brainsos.local,api.bawtford.brainsos.local,api.cindypawford.brainsos.local,host.docker.internal,litellm,localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
      - "proxy.brainsos.local:host-gateway"
      - "api.terrastella.brainsos.local:host-gateway"
      - "api.marvin.brainsos.local:host-gateway"
      - "api.bawtford.brainsos.local:host-gateway"
      - "api.cindypawford.brainsos.local:host-gateway"
    networks:
      - langfuse-net

  # ----------------------------------------------------------------------------
  # ClickHouse OLAP Columnar Store
  # Ultra-fast analytics database for traces, spans, generations and scores
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: brainsos-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - ${LANGFUSE_CLICKHOUSE_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-../../data/telemetry}/clickhouse}:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      - langfuse-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis Queue & Cache
  # Ingestion buffering and asynchronous job orchestration
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: brainsos-langfuse-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_AUTH:-myredissecret} --maxmemory-policy noeviction
    volumes:
      - ${LANGFUSE_REDIS_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-../../data/telemetry}/redis}:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - langfuse-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_AUTH:-myredissecret} ping | grep -q PONG || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # MinIO Object Storage (S3-Compatible)
  # Persistent blob storage for traces, raw payloads, and media
  # ----------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio
    container_name: brainsos-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - ${LANGFUSE_MINIO_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-../../data/telemetry}/minio}:/data
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    networks:
      - langfuse-net
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/9000)' || exit 1" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Langfuse Dedicated Persistence: PostgreSQL Database
  # Decoupled transactional database for projects, virtual keys, users, and auth
  # ----------------------------------------------------------------------------
  langfuse-db:
    image: postgres:16-alpine
    container_name: brainsos-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-brainsos_langfuse_secret_change_me}
    volumes:
      - ${LANGFUSE_DB_DATA_DIR:-${BRAINSOS_TELEMETRY_DIR:-../../data/telemetry}/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LANGFUSE_DB_PORT:-5433}:5432"
    networks:
      - langfuse-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  langfuse-net:
    name: brainsos-langfuse-net
    driver: bridge
