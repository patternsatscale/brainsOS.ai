# brainsOS: Lightweight Dovecot IMAP/LMTP Engine
# Footprint: ~15MB RAM, zero cloud dependencies

protocols = imap lmtp
listen = *
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log
debug_log_path = /var/log/dovecot.log
mail_debug = yes
log_timestamp = "%Y-%m-%d %H:%M:%S "
import_environment = TZ HERMES_API_TERRASTELLA_KEY HERMES_API_MARVIN_KEY HERMES_API_BAWTFORD_KEY BRAINSOS_AGENT_HOST BRAINSOS_AGENT_PORT_TERRASTELLA BRAINSOS_AGENT_PORT_MARVIN BRAINSOS_AGENT_PORT_BAWTFORD BRAINSOS_INGRESS_URL BRAINSOS_SPOOL_DIR

first_valid_uid = 100
first_valid_gid = 100

# Authentication: simple passwd-file from /etc/mail-brainsos/users
auth_default_realm = brainsos.local

# Trusted In-Cluster Proxy Authentication (Restricted strictly to SOGo container & localhost)
passdb {
  driver = static
  args = nopassword=y allow_nets=172.16.0.0/12,127.0.0.1/8
}

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/mail-brainsos/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/mail-brainsos/users
  default_fields = uid=vmail gid=vmail home=/var/mail/vmail/%n
}

# Storage layout: Maildir on local disk
mail_location = maildir:/var/mail/vmail/%n/Maildir
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail

# Personal Mailbox Namespace
namespace inbox {
  inbox = yes
  separator = /
  prefix =
  location = maildir:/var/mail/vmail/%n/Maildir

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

# Shared Mailbox Namespace: "Agent Fleet/<agent>/"
namespace shared {
  type = shared
  separator = /
  prefix = Agent Fleet/%%n/
  location = maildir:/var/mail/vmail/%%n/Maildir:INDEX=/var/mail/vmail/%n/shared/%%n
  subscriptions = yes
  list = children
}

# ACL Configuration: Allows Admin full access to Agent Fleet
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
plugin {
  acl = vfile
  acl_shared_dict = file:/var/mail/vmail/shared-mailboxes.db
}

# LMTP & Sieve Hook Engine (Ready for Issue #164 Agent Webhooks)
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  sieve_before = /etc/dovecot/sieve/default.sieve
  sieve = file:/etc/dovecot/sieve/%u.sieve;active=/etc/dovecot/sieve/%u.active.sieve
  sieve_plugins = sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe
  sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe
}

# IMAP listening on standard port 143
service imap-login {
  inet_listener imap {
    port = 143
  }
  process_min_avail = 1
  service_count = 0
}

# LMTP listening on port 24 for Postfix handoff
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# Auth service for Postfix SASL
service auth {
  inet_listener auth {
    port = 12345
  }
}
