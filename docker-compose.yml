# ==============================================================================
# Project Titan: Service Topology & Network Plane Separation
# ==============================================================================

name: titan

services:
  # ----------------------------------------------------------------------------
  # Ingress Plane: Caddy Reverse Proxy
  # Routes *.titan.local to internal services and handles streaming SSE
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: titan-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - titan-ingress
    environment:
      - TITAN_DOMAIN=${TITAN_DOMAIN:-titan.local}

  # ----------------------------------------------------------------------------
  # Control Plane Persistence: LiteLLM Dedicated PostgreSQL Database
  # Decoupled dynamic persistence for models, virtual keys, and rate limits
  # Strictly isolated on titan-litellm-net; unreachable by Hermes agent
  # ----------------------------------------------------------------------------
  litellm-db:
    image: postgres:16-alpine
    container_name: titan-litellm-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-titan_litellm_secret_change_me}
    volumes:
      - ${LITELLM_DB_DATA_DIR:-./data/litellm_db}:/var/lib/postgresql/data
    networks:
      - titan-litellm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d ${LITELLM_DB_NAME:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Memory Plane: SilverBullet PKM UI
  # Human-in-the-loop interactive browser UI inspecting pure OKF Markdown files
  # ----------------------------------------------------------------------------
  silverbullet:
    image: zefhemel/silverbullet:latest
    container_name: titan-silverbullet
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${SILVERBULLET_PORT:-3000}:3000"
    volumes:
      # Mounts the pure OKF markdown directory
      - ${TITAN_DATA_DIR:-./data/memories}:/space
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SB_HOSTNAME=0.0.0.0
      - SB_PORT=3000
    networks:
      - titan-ingress

  # ----------------------------------------------------------------------------
  # Agent Plane: Hermes Agent Sandbox
  # Ephemeral sandbox runtime: full command, browser, and tooling flexibility
  # Strictly barred from host Docker socket; writes only OKF to /memories
  # ----------------------------------------------------------------------------
  hermes:
    build:
      context: .
      dockerfile: docker/hermes/Dockerfile
    image: titan-hermes:latest
    container_name: titan-hermes
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
    volumes:
      # PURE OKF Markdown memory mount only
      - ${TITAN_DATA_DIR:-./data/memories}:/memories
      # Read-only configuration
      - ./config/hermes:/app/config:ro
      # Internal sandbox state for packages, tools, caches, and local databases
      - hermes_runtime_state:/workspace
    working_dir: /workspace
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_LITELLM_KEY=${HERMES_LITELLM_KEY}
      - LITELLM_URL=http://litellm:${LITELLM_PORT:-4000}/v1
      - MEMORY_DIR=/memories
      - WORKSPACE_DIR=/workspace
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-4096}
    networks:
      - titan-ingress
      - titan-internal

# ==============================================================================
# Isolated Network Topology
# ==============================================================================
networks:
  # Ingress network: connects Caddy to service ports
  titan-ingress:
    name: titan-ingress
    driver: bridge

  # Agent internal network: allows agent WAN egress (web browsing, Signal)
  # and routing to LiteLLM via host.docker.internal
  titan-internal:
    name: titan-internal
    driver: bridge

  # LiteLLM control plane database network: isolated from agent plane
  titan-litellm-net:
    name: titan-litellm-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: titan_caddy_data
  caddy_config:
    name: titan_caddy_config
  hermes_runtime_state:
    name: titan_hermes_runtime_state
