# ==============================================================================
# brainsOS: Shared Platform Core Topology
# 5-Plane Modular Architecture (Aligned with L1-L7 Reference Architecture)
# ==============================================================================

name: brainsos

include:
  - docker/compose/compose.ingress.yml
  - docker/compose/compose.apps.yml
  - docker/compose/compose.agents.yml
  - docker/compose/compose.control.yml
  - docker/compose/compose.telemetry.yml

# ==============================================================================
# Isolated Network Topology (L2: Virtualization & Isolation)
# Standardized 5-Plane Taxonomy: brainsos-<plane>-net
# ==============================================================================
networks:
  # 1. Ingress network: connects Caddy to service ports and auth gates
  brainsos-ingress-net:
    name: brainsos-ingress-net
    driver: bridge

  # 2. Agent internal network: allows agent WAN egress (web browsing, Signal, egress proxy)
  brainsos-internal-net:
    name: brainsos-internal-net
    driver: bridge

  # 3. Control plane database network: isolated from agent plane (Rule 6)
  brainsos-control-net:
    name: brainsos-control-net
    driver: bridge

  # 4. Operator IDE network: isolated from agent plane; connects Caddy to code-server
  brainsos-ide-net:
    name: brainsos-ide-net
    driver: bridge

  # 5. Telemetry & distributed observability network
  brainsos-telemetry-net:
    name: brainsos-telemetry-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: brainsos_caddy_data
  caddy_config:
    name: brainsos_caddy_config
  tool_egress_proxy_data:
    name: brainsos_tool_egress_proxy_data
  hermes_runner_data:
    name: brainsos_hermes_runner_data
