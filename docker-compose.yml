# ==============================================================================
# Project Titan: Shared Platform Core Topology
# Aligned with the Titan L1-L7 Reference Architecture
# ==============================================================================

name: titan

# Include dynamically managed agent units from fleet manifest
include:
  - docker-compose.agents.yml

services:
  # ============================================================================
  # L7: Communications & UX Plane
  # Ingress reverse proxy, messaging daemons, and visual knowledge base UIs
  # ============================================================================

  # Ingress Gateway: Caddy Reverse Proxy (Ports 80/443)
  caddy:
    image: caddy:2-alpine
    container_name: titan-net-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      titan-ingress:
      titan-internal:
      titan-operator-net:
    environment:
      - TITAN_DOMAIN=${TITAN_DOMAIN:-titan.local}

  # Communications Daemon: Signal CLI REST/JSON-RPC (Port 8080)
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: titan-net-signal-cli
    restart: unless-stopped
    entrypoint: ["/entrypoint-titan.sh"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      - MODE=json-rpc
      - PORT=8080
      - SIGNAL_NATIVE_HTTP_PORT=8082
      - SIGNAL_REST_API_PORT=8084
    volumes:
      - ${TITAN_COMMS_DIR:-./data/comms}/signal:/home/.local/share/signal-cli
      - ./docker/signal/entrypoint.sh:/entrypoint-titan.sh:ro
      - ./docker/signal/gateway_proxy.py:/usr/local/bin/gateway_proxy.py:ro
    networks:
      titan-internal:
        aliases:
          - titan-net-signal-cli
          - titan-signal-cli
          - signal-cli

  # Operator IDE: Containerized VS Code (Code-Server) with Aider & Goose
  code-server:
    build:
      context: .
      dockerfile: docker/editor/Dockerfile
    image: titan-code-server:latest
    container_name: titan-app-code-server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8443}:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
    volumes:
      - ${TITAN_CODE_SERVER_CONFIG:-./data/control_plane/vscode_config}:/home/coder/.config
      - ${TITAN_CODE_SERVER_DATA:-./data/control_plane/vscode_data}:/home/coder/.local/share/code-server
      - .:/workspace/project-titan
      - ${TITAN_AGENT_MEMORIES_DIR:-${TITAN_DATA_DIR:-./data/agent_memories}}:/memories
      - ${TITAN_AGENT_WORKSPACES_DIR:-${TITAN_WORKSPACE_DIR:-./data/agent_workspaces}}:/data/workspace
      - ${TITAN_COMMS_DIR:-./data/comms}:/data/comms
      - ./apps/cindypawford/site:/apps/cindypawford/site
      - ./config/editor/titan.code-workspace:/workspace/titan.code-workspace:ro
      - ./docker/editor/entrypoint.sh:/usr/local/bin/titan-editor-entrypoint.sh:ro
      - ./data/control_plane/caddy_root.crt:/etc/ssl/caddy/root.crt:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - CODE_SERVER_AUTH=${CODE_SERVER_AUTH:-none}
      - PASSWORD=${CODE_SERVER_PASSWORD:-titan_operator_secret}
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPERATOR_LITELLM_KEY:-sk-titan-operator-virtual-key}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_EXTRA_CA_CERTS=/etc/ssl/caddy/root.crt
      - SSL_CERT_FILE=/etc/ssl/caddy/root.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/caddy/root.crt
      - CURL_CA_BUNDLE=/etc/ssl/caddy/root.crt
    networks:
      - titan-operator-net

  # ============================================================================
  # L4: Tool Egress Gateway & Inspection Proxy (mitmproxy / mitmweb)
  # Intercepts, logs, and audits outbound HTTP/HTTPS traffic from agent tools
  # Web console bound to host loopback & accessible via Caddy (efw.titan.local)
  # Forward proxy listens on internal port 8082
  # ============================================================================
  tool-egress-proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: titan-net-egress-proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${TOOL_EGRESS_WEB_PORT:-8081}:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - TOOL_EGRESS_WEB_PASSWORD=${TOOL_EGRESS_WEB_PASSWORD:-titan_tool_egress_secret}
      - GITHUB_TOKEN_CINDY=${GITHUB_TOKEN_CINDY:-}
      - GITHUB_BASIC_AUTH_CINDY=${GITHUB_BASIC_AUTH_CINDY:-}
    command:
      - "mitmweb"
      - "--web-host"
      - "0.0.0.0"
      - "--web-port"
      - "8081"
      - "--listen-port"
      - "8082"
      - "--set"
      - "block_global=false"
      - "--set"
      - "web_password=${TOOL_EGRESS_WEB_PASSWORD:-titan_tool_egress_secret}"
      - "--no-web-open-browser"
      - "-s"
      - "/addons/github_auth.py"
    volumes:
      - tool_egress_proxy_data:/home/mitmproxy/.mitmproxy
      - ./config/egress/addons:/addons:ro
    networks:
      titan-internal:
        aliases:
          - titan-net-egress-proxy
          - titan-tool-egress-proxy
          - tool-egress-proxy
          - efw
          - firewall

  # ============================================================================
  # L4: Routing & Security Plane
  # Control plane persistence: Dedicated PostgreSQL Database for LiteLLM
  # Decoupled dynamic persistence for models, virtual keys, rate limits & budgets
  # Strictly isolated on titan-litellm-net; unreachable by agent containers
  # ============================================================================
  litellm-db:
    image: postgres:16-alpine
    container_name: titan-infra-litellm-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-titan_litellm_secret_change_me}
    volumes:
      - ${LITELLM_DB_DATA_DIR:-./data/control_plane/litellm_db}:/var/lib/postgresql/data
    networks:
      - titan-litellm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d ${LITELLM_DB_NAME:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

# ==============================================================================
# Isolated Network Topology (L2: Virtualization & Isolation)
# ==============================================================================
networks:
  # Ingress network: connects Caddy to service ports
  titan-ingress:
    name: titan-ingress
    driver: bridge

  # Agent internal network: allows agent WAN egress (web browsing, Signal)
  # and routing to LiteLLM via host.docker.internal
  titan-internal:
    name: titan-internal
    driver: bridge

  # Operator IDE network: isolated from agent plane; connects Caddy to code-server
  titan-operator-net:
    name: titan-operator-net
    driver: bridge

  # LiteLLM control plane database network: isolated from agent plane
  titan-litellm-net:
    name: titan-litellm-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: titan_caddy_data
  caddy_config:
    name: titan_caddy_config
  tool_egress_proxy_data:
    name: titan_tool_egress_proxy_data
