# ==============================================================================
# brainsOS: Shared Platform Core Topology
# Aligned with the brainsOS L1-L7 Reference Architecture
# ==============================================================================

name: brainsos

services:
  # ============================================================================
  # L7: Communications & UX Plane
  # Ingress reverse proxy, messaging daemons, and visual knowledge base UIs
  # ============================================================================

  # Ingress Gateway: Caddy Reverse Proxy (Ports 80/443)
  caddy:
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    image: brainsos-caddy:latest
    container_name: brainsos-net-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - ./packages/brainsOS-portal/dist:/srv/portal:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      brainsos-ingress:
      brainsos-internal:
      brainsos-operator-net:
    environment:
      - BRAINSOS_DOMAIN=${BRAINSOS_DOMAIN:-brainsos.local}
      - BRAINSOS_MAIL_DOMAIN=${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}
      - BRAINSOS_MAIL_HOST=${BRAINSOS_MAIL_HOST:-}
      - OPERATOR_USER=${OPERATOR_USER:-operator}
      - OPERATOR_PASSWORD_HASH=${OPERATOR_PASSWORD_HASH:-}
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_secret}}
      - TOOL_EGRESS_WEB_PASSWORD=${TOOL_EGRESS_WEB_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_tool_egress_secret}}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - AWS_ACCESS_KEY_ID=${BRAINSOS_INFRA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      - AWS_SECRET_ACCESS_KEY=${BRAINSOS_INFRA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      - AWS_REGION=${BRAINSOS_INFRA_AWS_REGION:-${AWS_REGION:-us-east-1}}
      - ACME_DNS_PROVIDER=${ACME_DNS_PROVIDER:-route53}
      - ACME_EMAIL=${ACME_EMAIL:-}
    command: >
      sh -c 'if [ -z "$${AWS_ACCESS_KEY_ID}" ]; then unset AWS_ACCESS_KEY_ID; unset AWS_SECRET_ACCESS_KEY; fi;
      if [ -z "$${OPERATOR_PASSWORD_HASH}" ] && [ -n "$${CODE_SERVER_PASSWORD}" ]; then
        export OPERATOR_PASSWORD_HASH="$$(caddy hash-password --plaintext "$${CODE_SERVER_PASSWORD}")";
      fi;
      if [ -z "$${BRAINSOS_MAIL_HOST}" ]; then
        if [ "$${BRAINSOS_MAIL_DOMAIN}" = "$${BRAINSOS_DOMAIN}" ] || [ -z "$${BRAINSOS_MAIL_DOMAIN}" ]; then
          export BRAINSOS_MAIL_HOST="mail.$${BRAINSOS_DOMAIN}";
        else
          export BRAINSOS_MAIL_HOST="$${BRAINSOS_MAIL_DOMAIN}";
        fi;
      fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'

  # Communications Daemon: Signal CLI REST/JSON-RPC (Port 8080)
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: brainsos-net-signal-cli
    restart: unless-stopped
    entrypoint: ["/entrypoint-brainsos.sh"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      - MODE=json-rpc
      - PORT=8080
      - SIGNAL_NATIVE_HTTP_PORT=8082
      - SIGNAL_REST_API_PORT=8084
    volumes:
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/signal:/home/.local/share/signal-cli
      - ./docker/signal/entrypoint.sh:/entrypoint-brainsos.sh:ro
      - ./docker/signal/gateway_proxy.py:/usr/local/bin/gateway_proxy.py:ro
    networks:
      brainsos-internal:
        aliases:
          - brainsos-net-signal-cli
          - brainsos-signal-cli
          - signal-cli

  # Communications & Mail Plane: Postfix + Dovecot Mail Engine
  mail-server:
    build:
      context: ./docker/mail
      dockerfile: Dockerfile
    image: brainsos-mail-server:latest
    container_name: brainsos-net-mail-server
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-10025}:25"
      - "127.0.0.1:${MAIL_IMAP_PORT:-10143}:143"
    volumes:
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/email/vmail:/var/mail/vmail
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/email/config:/etc/mail-brainsos
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/spool:/var/spool/brainsos/inbound
      - ./docker/mail/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./docker/mail/agent-webhook.sh:/usr/lib/dovecot/sieve-pipe/agent-webhook.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "control-plane:host-gateway"
    environment:
      - BRAINSOS_DOMAIN=${BRAINSOS_DOMAIN:-brainsos.local}
      - BRAINSOS_MAIL_DOMAIN=${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}
      - BRAINSOS_EMAIL_DOMAIN=${BRAINSOS_EMAIL_DOMAIN:-}
      - ADMIN_MAIL_PASSWORD=${ADMIN_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_mail_secret_change_me}}
      - OPERATOR_MAIL_PASSWORD=${OPERATOR_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_mail_secret_change_me}}
      - TERRASTELLA_MAIL_PASSWORD=${TERRASTELLA_MAIL_PASSWORD:-brainsos_terrastella_mail_secret_change_me}
      - BAWTFORD_MAIL_PASSWORD=${BAWTFORD_MAIL_PASSWORD:-brainsos_bawtford_mail_secret_change_me}
      - MARVIN_MAIL_PASSWORD=${MARVIN_MAIL_PASSWORD:-brainsos_marvin_mail_secret_change_me}
      - PING_MAIL_PASSWORD=${PING_MAIL_PASSWORD:-brainsos_ping_mail_secret_change_me}
      - HERMES_API_TERRASTELLA_KEY=${HERMES_API_TERRASTELLA_KEY:-}
      - HERMES_API_MARVIN_KEY=${HERMES_API_MARVIN_KEY:-}
      - HERMES_API_BAWTFORD_KEY=${HERMES_API_BAWTFORD_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/postfix status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      brainsos-internal:
        aliases:
          - brainsos-net-mail-server
          - brainsos-mail-server
          - mail-server
          - mail

  # Communications & Mail Plane: Inbound Email Ingress Daemon (AWS SQS/S3 -> Postfix)
  mail-ingress:
    build:
      context: .
      dockerfile: docker/mail/Dockerfile.ingress
    image: brainsos-mail-ingress:latest
    container_name: brainsos-net-mail-ingress
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mail-server:
        condition: service_healthy
    networks:
      brainsos-internal:
        aliases:
          - brainsos-net-mail-ingress
          - brainsos-mail-ingress
          - mail-ingress
    environment:
      - AWS_REGION=${BRAINSOS_INFRA_AWS_REGION:-${AWS_REGION:-us-east-1}}
      - AWS_ACCESS_KEY_ID=${INGRESS_AWS_ACCESS_KEY_ID:-${BRAINSOS_INFRA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}}
      - AWS_SECRET_ACCESS_KEY=${INGRESS_AWS_SECRET_ACCESS_KEY:-${BRAINSOS_INFRA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}}
      - INGRESS_AWS_ACCESS_KEY_ID=${INGRESS_AWS_ACCESS_KEY_ID:-}
      - INGRESS_AWS_SECRET_ACCESS_KEY=${INGRESS_AWS_SECRET_ACCESS_KEY:-}
      - INGRESS_QUEUE_URL=${INGRESS_QUEUE_URL:-}
      - INGRESS_S3_BUCKET=${INGRESS_S3_BUCKET:-${INGRESS_BUCKET_NAME:-}}
      - INGRESS_BUCKET_NAME=${INGRESS_BUCKET_NAME:-${INGRESS_S3_BUCKET:-}}
      - LOCAL_SMTP_HOST=mail
      - LOCAL_SMTP_PORT=25
      - INGRESS_POLL_WAIT_SECONDS=${INGRESS_POLL_WAIT_SECONDS:-20}
      - INGRESS_MAX_MESSAGES=${INGRESS_MAX_MESSAGES:-5}

  # Communications Plane: Dedicated Isolated SOGo Database (PostgreSQL 16)
  # Rule 6 Invariant: Completely isolated from brainsos-infra-litellm-db.
  sogo-db:
    image: postgres:16-alpine
    container_name: brainsos-sogo-db
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_USER: ${SOGO_DB_USER:-sogo}
      POSTGRES_PASSWORD: ${SOGO_DB_PASSWORD:-sogo_secret_pass}
      POSTGRES_DB: ${SOGO_DB_NAME:-sogo}
    volumes:
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/sogo/db:/var/lib/postgresql/data
    networks:
      - brainsos-internal
    ports:
      - "127.0.0.1:${SOGO_DB_PORT:-5434}:5432"

  # Communications & UX Plane: SOGo Groupware & Webmail/CalDAV Client
  # Webmail, CalDAV Calendars, and Scheduled Alarms.
  sogo:
    build:
      context: ./docker/sogo
      dockerfile: Dockerfile
    image: brainsos-sogo:latest
    container_name: brainsos-net-sogo
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${SOGO_PORT:-20000}:20000"
    volumes:
      - ${BRAINSOS_COMMS_DIR:-${BRAINSOS_DATA_DIR:-./data}/comms}/sogo/spool:/var/spool/sogo
      - ./docker/sogo/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/sogo/sogo.conf:/etc/sogo/sogo.conf.template:ro
      - ./docker/sogo/theme-brainsos.css:/usr/lib/GNUstep/SOGo/WebServerResources/css/theme-brainsos.css:ro
      - ./docker/sogo/theme-brainsos.js:/usr/lib/GNUstep/SOGo/WebServerResources/js/theme-brainsos.js:ro
      - ./docker/sogo/nginx.conf:/etc/nginx/sites-enabled/default:ro
    networks:
      brainsos-ingress:
      brainsos-internal:
        ipv4_address: 172.20.0.50
    depends_on:
      - sogo-db
      - mail-server
    environment:
      - SOGO_DB_HOST=brainsos-sogo-db
      - SOGO_DB_PORT=5432
      - SOGO_DB_USER=${SOGO_DB_USER:-sogo}
      - SOGO_DB_PASSWORD=${SOGO_DB_PASSWORD:-sogo_secret_pass}
      - SOGO_DB_NAME=${SOGO_DB_NAME:-sogo}
      - ADMIN_MAIL_PASSWORD=${ADMIN_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_mail_secret_change_me}}
      - OPERATOR_MAIL_PASSWORD=${OPERATOR_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_mail_secret_change_me}}
      - TERRASTELLA_MAIL_PASSWORD=${TERRASTELLA_MAIL_PASSWORD:-brainsos_terrastella_mail_secret_change_me}
      - BAWTFORD_MAIL_PASSWORD=${BAWTFORD_MAIL_PASSWORD:-brainsos_bawtford_mail_secret_change_me}
      - MARVIN_MAIL_PASSWORD=${MARVIN_MAIL_PASSWORD:-brainsos_marvin_mail_secret_change_me}
      - PING_MAIL_PASSWORD=${PING_MAIL_PASSWORD:-brainsos_ping_mail_secret_change_me}
      - BRAINSOS_DOMAIN=${BRAINSOS_DOMAIN:-brainsos.local}
      - BRAINSOS_MAIL_DOMAIN=${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}

  # ============================================================================
  # L7 / Security Plane: Authentik Identity Provider (Zero-Trust SSO)
  # Centralized Single Sign-On, Passkey FIDO2, and Caddy forward_auth
  # ============================================================================
  authentik-db:
    image: postgres:16-alpine
    container_name: brainsos-auth-db
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_db_secret}
    volumes:
      - ${BRAINSOS_AUTHENTIK_DB_DIR:-${BRAINSOS_DATA_DIR:-./data}/control_plane/authentik_db}:/var/lib/postgresql/data
    networks:
      - brainsos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER:-authentik} -d ${AUTHENTIK_POSTGRESQL__NAME:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    container_name: brainsos-auth-redis
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - brainsos-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: brainsos-auth-server
    restart: unless-stopped
    command: server
    security_opt:
      - "no-new-privileges:true"
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_db_secret}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-brainsos_authentik_secret_change_me}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_secret}}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-${BRAINSOS_ADMIN_EMAIL:-admin@brainsos.local}}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-brainsos_authentik_api_token}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:-local.brainsos.ai}
    volumes:
      - ./config/authentik/themes/brainsos/theme.css:/web/dist/custom.css:ro
      - ./config/authentik/themes/brainsos/brainsos_logo.svg:/web/dist/assets/icons/brainsos_logo.svg:ro
      - ./config/authentik/themes/brainsos:/templates/custom-themes/brainsos:ro
      - ./config/authentik/blueprints:/blueprints/brainsos:ro
      - ${BRAINSOS_AUTHENTIK_MEDIA_DIR:-${BRAINSOS_DATA_DIR:-./data}/control_plane/authentik_media}:/media
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-9002}:9000"
    networks:
      - brainsos-ingress
      - brainsos-internal
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: brainsos-auth-worker
    restart: unless-stopped
    command: worker
    security_opt:
      - "no-new-privileges:true"
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik_db_secret}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-brainsos_authentik_secret_change_me}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_secret}}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-${BRAINSOS_ADMIN_EMAIL:-admin@brainsos.local}}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-brainsos_authentik_api_token}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:-local.brainsos.ai}
    volumes:
      - ./config/authentik/themes/brainsos/theme.css:/web/dist/custom.css:ro
      - ./config/authentik/themes/brainsos/brainsos_logo.svg:/web/dist/assets/icons/brainsos_logo.svg:ro
      - ./config/authentik/themes/brainsos:/templates/custom-themes/brainsos:ro
      - ./config/authentik/blueprints:/blueprints/brainsos:ro
      - ${BRAINSOS_AUTHENTIK_MEDIA_DIR:-${BRAINSOS_DATA_DIR:-./data}/control_plane/authentik_media}:/media
    networks:
      - brainsos-internal
    depends_on:
      - authentik-server

  # Operator IDE: Containerized VS Code (Code-Server) with Aider & Goose
  code-server:
    build:
      context: .
      dockerfile: docker/editor/Dockerfile
    image: brainsos-code-server:latest
    container_name: brainsos-app-code-server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8443}:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "litellm:host-gateway"
    volumes:
      - ${BRAINSOS_CODE_SERVER_CONFIG:-${BRAINSOS_DATA_DIR:-./data}/control_plane/vscode_config}:/home/coder/.config
      - ${BRAINSOS_CODE_SERVER_DATA:-${BRAINSOS_DATA_DIR:-./data}/control_plane/vscode_data}:/home/coder/.local/share/code-server
      - ${BRAINSOS_DATA_DIR:-./data}:/data
      - ${BRAINSOS_AGENT_MEMORIES_DIR:-${BRAINSOS_DATA_DIR:-./data}/agent_memories}:/memories
      - ./config/editor:/etc/brainsos/editor:ro
      - ./docker/editor/entrypoint.sh:/usr/local/bin/brainsos-editor-entrypoint.sh:ro
      - ./config/editor/extensions/brainsos-system-terminal:/opt/code-server/extensions/brainsos.system-terminal-1.0.0:ro
      - ${BRAINSOS_CONTROL_PLANE_DIR:-${BRAINSOS_DATA_DIR:-./data}/control_plane}/caddy_root.crt:/etc/ssl/caddy/root.crt:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - CODE_SERVER_AUTH=${CODE_SERVER_AUTH:-none}
      - PASSWORD=${CODE_SERVER_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_secret}}
      - BRAINSOS_DOMAIN=${BRAINSOS_DOMAIN:-brainsos.local}
      - BRAINSOS_MAIL_DOMAIN=${BRAINSOS_MAIL_DOMAIN:-${BRAINSOS_DOMAIN:-brainsos.local}}
      - CADDY_HTTP_PORT=${CADDY_HTTP_PORT:-80}
      - CADDY_HTTPS_PORT=${CADDY_HTTPS_PORT:-443}
      - CODE_SERVER_PORT=${CODE_SERVER_PORT:-8443}
      - OPERATOR_USER=${OPERATOR_USER:-operator}
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_secret}}
      - LITELLM_PORT=${LITELLM_PORT:-4000}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - SOGO_PORT=${SOGO_PORT:-20000}
      - LANGFUSE_PORT=${LANGFUSE_PORT:-3001}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@${BRAINSOS_DOMAIN:-brainsos.local}}
      - TOOL_EGRESS_WEB_PORT=${TOOL_EGRESS_WEB_PORT:-8081}
      - HERMES_RUNNER_PORT=${HERMES_RUNNER_PORT:-8642}
      - OPENAI_RUNNER_PORT=${OPENAI_RUNNER_PORT:-8002}
      - AGENT_QUEUE_PORT=${AGENT_QUEUE_PORT:-8000}
      - ADMIN_MAIL_PASSWORD=${ADMIN_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_admin_mail_secret_change_me}}
      - OPERATOR_MAIL_PASSWORD=${OPERATOR_MAIL_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_operator_mail_secret_change_me}}
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPERATOR_LITELLM_KEY:-sk-brainsos-operator-virtual-key}
      - HERMES_API_TERRASTELLA_KEY=${HERMES_API_TERRASTELLA_KEY:-}
      - HERMES_API_MARVIN_KEY=${HERMES_API_MARVIN_KEY:-}
      - HERMES_API_BAWTFORD_KEY=${HERMES_API_BAWTFORD_KEY:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_EXTRA_CA_CERTS=/etc/ssl/caddy/root.crt
      - SSL_CERT_FILE=/etc/ssl/caddy/root.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/caddy/root.crt
      - CURL_CA_BUNDLE=/etc/ssl/caddy/root.crt
    networks:
      - brainsos-operator-net
      - brainsos-internal

  # ============================================================================
  # L4: Tool Egress Gateway & Inspection Proxy (mitmproxy / mitmweb)
  # Intercepts, logs, and audits outbound HTTP/HTTPS traffic from agent tools
  # Web console bound to host loopback & accessible via Caddy (efw.brainsos.local)
  # Forward proxy listens on internal port 8082
  # ============================================================================
  tool-egress-proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: brainsos-net-egress-proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${TOOL_EGRESS_WEB_PORT:-8081}:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - TOOL_EGRESS_WEB_PASSWORD=${TOOL_EGRESS_WEB_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_tool_egress_secret}}
      - GITHUB_TOKEN_CINDY=${GITHUB_TOKEN_CINDY:-}
      - GITHUB_BASIC_AUTH_CINDY=${GITHUB_BASIC_AUTH_CINDY:-}
    command:
      - "mitmweb"
      - "--web-host"
      - "0.0.0.0"
      - "--web-port"
      - "8081"
      - "--listen-port"
      - "8082"
      - "--set"
      - "block_global=false"
      - "--set"
      - "web_password=${TOOL_EGRESS_WEB_PASSWORD:-${BRAINSOS_ADMIN_PASSWORD:-brainsos_tool_egress_secret}}"
      - "--no-web-open-browser"
      - "-s"
      - "/addons/github_auth.py"
    volumes:
      - tool_egress_proxy_data:/home/mitmproxy/.mitmproxy
      - ./config/egress/addons:/addons:ro
    networks:
      brainsos-internal:
        aliases:
          - brainsos-net-egress-proxy
          - brainsos-tool-egress-proxy
          - tool-egress-proxy
          - efw
          - firewall

  # ============================================================================
  # L2: Cognitive Compute Plane - Runner Fleet
  # Serves agent turns via universal IPC (/v1/agent/run) across ecosystems
  # Rule 2: Routes strictly through LiteLLM (http://host.docker.internal:4000/v1)
  # Rule 4: Unprivileged, no docker socket mounts
  # ============================================================================

  # Hermes Warm Runner (Port 8642)
  runner-hermes:
    build:
      context: .
      dockerfile: docker/runners/hermes/Dockerfile
    image: brainsos-runner-hermes:latest
    container_name: brainsos-runner-hermes
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${HERMES_RUNNER_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_RUNNER_WEB_PORT:-8787}:8787"
    environment:
      - API_SERVER_ENABLED=true
      - PORT=8642
      - OPENAI_BASE_URL=${LITELLM_URL:-http://host.docker.internal:4000/v1}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-brainsos-master-key}
      - LITELLM_URL=${LITELLM_URL:-http://host.docker.internal:4000/v1}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,mail-server,brainsos-net-mail-server
    volumes:
      - ${BRAINSOS_MEMORIES_DIR:-${BRAINSOS_AGENT_MEMORIES_DIR:-${BRAINSOS_DATA_DIR:-./data}/agent_memories}}:/data/agent_memories
      - ${BRAINSOS_WORKSPACES_DIR:-${BRAINSOS_AGENT_WORKSPACES_DIR:-${BRAINSOS_DATA_DIR:-./data}/agent_workspaces}}:/data/agent_workspaces
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-./data}/runners}/hermes:/config/hermes:ro
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-./data}/runners}/hermes:/root/.hermes:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-ingress: {}
      brainsos-internal:
        aliases:
          - runner-hermes
          - hermes-runner
          - brainsos-agent-hermes-runner

  # OpenAI SDK Warm Runner (Port 8002)
  runner-openai:
    build:
      context: .
      dockerfile: docker/runners/openai-sdk/Dockerfile
    image: brainsos-runner-openai:latest
    container_name: brainsos-runner-openai
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${OPENAI_RUNNER_PORT:-8002}:8002"
    environment:
      - OPENAI_BASE_URL=${LITELLM_URL:-http://host.docker.internal:4000/v1}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-brainsos-master-key}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,mail-server
    volumes:
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-./data}/runners}:/data/runners:ro
      - ${BRAINSOS_WORKSPACES_DIR:-${BRAINSOS_AGENT_WORKSPACES_DIR:-${BRAINSOS_DATA_DIR:-./data}/agent_workspaces}}:/data/agent_workspaces:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-internal:
        aliases:
          - runner-openai
          - brainsos-runner-openai

  # Claude SDK Warm Runner (Port 8001)
  runner-claude:
    build:
      context: .
      dockerfile: docker/runners/claude-sdk/Dockerfile
    image: brainsos-runner-claude:latest
    container_name: brainsos-runner-claude
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${CLAUDE_RUNNER_PORT:-8001}:8001"
    environment:
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-${LITELLM_URL:-http://host.docker.internal:4000}}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-${LITELLM_MASTER_KEY:-sk-brainsos-master-key}}
      - LITELLM_URL=${LITELLM_URL:-http://host.docker.internal:4000}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-brainsos-master-key}
      - AWS_ACCESS_KEY_ID=${BRAINSOS_INFRA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      - AWS_SECRET_ACCESS_KEY=${BRAINSOS_INFRA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      - AWS_REGION=${BRAINSOS_INFRA_AWS_REGION:-${AWS_REGION:-us-east-1}}
      - HTTP_PROXY=http://brainsos-net-egress-proxy:8082
      - HTTPS_PROXY=http://brainsos-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,litellm,mail-server
    volumes:
      - ${BRAINSOS_RUNNERS_DIR:-${BRAINSOS_DATA_DIR:-./data}/runners}:/data/runners:ro
      - ${BRAINSOS_WORKSPACES_DIR:-${BRAINSOS_AGENT_WORKSPACES_DIR:-${BRAINSOS_DATA_DIR:-./data}/agent_workspaces}}:/data/agent_workspaces:rw
      - ${HOME}/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      brainsos-internal:
        aliases:
          - runner-claude
          - brainsos-runner-claude

  # ============================================================================
  # L4: Routing & Security Plane
  # Control plane persistence: Dedicated PostgreSQL Database for LiteLLM
  # Decoupled dynamic persistence for models, virtual keys, rate limits & budgets
  # Strictly isolated on brainsos-litellm-net; unreachable by agent containers
  # ============================================================================
  litellm-db:
    image: postgres:16-alpine
    container_name: brainsos-infra-litellm-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-brainsos_litellm_secret_change_me}
    volumes:
      - ${LITELLM_DB_DATA_DIR:-${BRAINSOS_DATA_DIR:-./data}/control_plane/litellm_db}:/var/lib/postgresql/data
    networks:
      - brainsos-litellm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d ${LITELLM_DB_NAME:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

# ==============================================================================
# Isolated Network Topology (L2: Virtualization & Isolation)
# ==============================================================================
networks:
  # Ingress network: connects Caddy to service ports
  brainsos-ingress:
    name: brainsos-ingress
    driver: bridge

  # Agent internal network: allows agent WAN egress (web browsing, Signal)
  # and routing to LiteLLM via host.docker.internal
  brainsos-internal:
    name: brainsos-internal
    driver: bridge

  # Operator IDE network: isolated from agent plane; connects Caddy to code-server
  brainsos-operator-net:
    name: brainsos-operator-net
    driver: bridge

  # LiteLLM control plane database network: isolated from agent plane
  brainsos-litellm-net:
    name: brainsos-litellm-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: brainsos_caddy_data
  caddy_config:
    name: brainsos_caddy_config
  tool_egress_proxy_data:
    name: brainsos_tool_egress_proxy_data
