# ==============================================================================
# Project Titan: Service Topology & Network Plane Separation
# ==============================================================================

name: titan

services:
  # ----------------------------------------------------------------------------
  # Ingress Plane: Caddy Reverse Proxy
  # Routes *.titan.local to internal services and handles streaming SSE
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: titan-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - titan-ingress
    environment:
      - TITAN_DOMAIN=${TITAN_DOMAIN:-titan.local}

  # ----------------------------------------------------------------------------
  # Control Plane Persistence: LiteLLM Dedicated PostgreSQL Database
  # Decoupled dynamic persistence for models, virtual keys, and rate limits
  # Strictly isolated on titan-litellm-net; unreachable by Hermes agent
  # ----------------------------------------------------------------------------
  litellm-db:
    image: postgres:16-alpine
    container_name: titan-litellm-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-titan_litellm_secret_change_me}
    volumes:
      - ${LITELLM_DB_DATA_DIR:-./data/litellm_db}:/var/lib/postgresql/data
    networks:
      - titan-litellm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d ${LITELLM_DB_NAME:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Memory Plane: SilverBullet PKM UI
  # Human-in-the-loop interactive browser UI inspecting pure OKF Markdown files
  # ----------------------------------------------------------------------------
  silverbullet:
    image: zefhemel/silverbullet:latest
    container_name: titan-silverbullet
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${SILVERBULLET_PORT:-3000}:3000"
    volumes:
      # Mounts the pure OKF markdown directory
      - ${TITAN_DATA_DIR:-./data/memories}:/space
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SB_HOSTNAME=0.0.0.0
      - SB_PORT=3000
    networks:
      - titan-ingress

  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # Messaging Plane: Signal CLI REST/JSON-RPC Daemon
  # Dedicated unprivileged daemon on titan-internal for Signal messenger
  # ----------------------------------------------------------------------------
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: titan-signal-cli
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - MODE=json-rpc
      - PORT=8080
    volumes:
      - ${TITAN_WORKSPACE_DIR:-./data/workspace}/signal:/home/.local/share/signal-cli
    networks:
      - titan-internal

  # ----------------------------------------------------------------------------
  # Agent Plane: Hermes Agent Sandbox & Web Dashboard
  # Upstream Nous Research Hermes Agent: Web Dashboard & multi-channel gateways
  # Strictly barred from host Docker socket; writes only OKF to /memories
  # ----------------------------------------------------------------------------
  hermes:
    build:
      context: .
      dockerfile: docker/hermes/Dockerfile
    image: titan-hermes:latest
    container_name: titan-hermes
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "proxy.local:host-gateway"
      - "litellm:host-gateway"
      - "langfuse.titan.local:${LANGFUSE_HOST_IP:-host-gateway}"
    volumes:
      # PURE OKF Markdown memory mount only
      - ${TITAN_DATA_DIR:-./data/memories}:/memories
      # Read-only configuration
      - ./config/hermes:/app/config:ro
      # Internal sandbox state for packages, tools, caches, and local databases (Host Bind-Mount)
      - ${TITAN_WORKSPACE_DIR:-./data/workspace}:/opt/data
      # Backward-compatibility workspace mount
      - ${TITAN_WORKSPACE_DIR:-./data/workspace}:/workspace
    working_dir: /opt/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_PORT=${HERMES_PORT:-8642}
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-titan_admin_secret}
      - HERMES_LITELLM_KEY=${HERMES_LITELLM_KEY}
      - CUSTOM_API_KEY=${HERMES_LITELLM_KEY}
      - OPENAI_API_KEY=${HERMES_LITELLM_KEY}
      - OPENAI_BASE_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - PROXY_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - LITELLM_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - MEMORY_DIR=/memories
      - WORKSPACE_DIR=/opt/data
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-4096}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=${HERMES_PORT:-8642}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - SIGNAL_HTTP_URL=http://signal-cli:8080
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT:-}
      - SIGNAL_ALLOWED_USERS=${SIGNAL_ALLOWED_USERS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - LANGFUSE_OTEL_AUTH=${LANGFUSE_OTEL_AUTH:-}
    command: ["sleep", "infinity"]
    depends_on:
      - signal-cli
    networks:
      - titan-ingress
      - titan-internal

# ==============================================================================
# Isolated Network Topology
# ==============================================================================
networks:
  # Ingress network: connects Caddy to service ports
  titan-ingress:
    name: titan-ingress
    driver: bridge

  # Agent internal network: allows agent WAN egress (web browsing, Signal)
  # and routing to LiteLLM via host.docker.internal
  titan-internal:
    name: titan-internal
    driver: bridge

  # LiteLLM control plane database network: isolated from agent plane
  titan-litellm-net:
    name: titan-litellm-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  caddy_data:
    name: titan_caddy_data
  caddy_config:
    name: titan_caddy_config
