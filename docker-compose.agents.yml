# ==============================================================================
# Project Titan: Declarative Multi-Agent Fleet Services
# Auto-generated by scripts/sync-agents.sh from config/agents.yaml.
# DO NOT EDIT DIRECTLY. Make changes in config/agents.yaml and re-run sync.
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # L2: Agent Core Unit: Titan Primary Operations Agent (primary)
  # --------------------------------------------------------------------------
  agent-primary:
    build:
      context: .
      dockerfile: docker/hermes/Dockerfile
    image: titan-hermes:latest
    container_name: titan-agent-primary
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "proxy.local:host-gateway"
      - "litellm:host-gateway"
      - "langfuse.titan.local:${LANGFUSE_HOST_IP:-host-gateway}"
    volumes:
      # L3: Memory Plane (pure OKF markdown)
      - ./data/memories/agents/primary:/memories
      # Read-only configuration
      - ./config/hermes:/app/config:ro
      # L3: Unprivileged Workspace Sandbox
      - ./data/workspace/primary:/opt/data
      - ./data/workspace/primary:/workspace
    working_dir: /opt/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_PORT=8642
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-titan_admin_secret}
      - HERMES_LITELLM_KEY=${HERMES_LITELLM_KEY:-sk-titan-primary-key}
      - CUSTOM_API_KEY=${HERMES_LITELLM_KEY:-sk-titan-primary-key}
      - OPENAI_API_KEY=${HERMES_LITELLM_KEY:-sk-titan-primary-key}
      - OPENAI_BASE_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - PROXY_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - LITELLM_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - MEMORY_DIR=/memories
      - WORKSPACE_DIR=/opt/data
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-4096}
      - HERMES_GATEWAY_BOOTSTRAP_STATE=running
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - SIGNAL_HTTP_URL=http://signal-cli:8080
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT:-}
      - SIGNAL_ALLOWED_USERS=${SIGNAL_ALLOWED_USERS:-}
      - TELEGRAM_BOT_NAME=@TitanPrimary_bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_PRIMARY:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS_PRIMARY:-${TELEGRAM_ALLOWED_USERS:-}}
      - LANGFUSE_OTEL_AUTH=${LANGFUSE_OTEL_AUTH:-}
    command: ["sleep", "infinity"]
    depends_on:
      - signal-cli
    networks:
      - titan-ingress
      - titan-internal

