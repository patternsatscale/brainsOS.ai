services:
  # --------------------------------------------------------------------------
  # L2: Agent Core Unit: Terrastella - Primary Operations Agent (terrastella)
  # --------------------------------------------------------------------------
  agent-terrastella:
    build:
      context: .
      dockerfile: docker/hermes/Dockerfile
    image: titan-hermes:latest
    container_name: titan-agent-terrastella
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "proxy.local:host-gateway"
      - "litellm:host-gateway"
      - "langfuse.titan.local:${LANGFUSE_HOST_IP:-host-gateway}"
    volumes:
      # L3: Memory Plane (pure OKF markdown)
      - ./data/memories/terrastella:/memories
      # Read-only configuration
      - ./config/hermes:/app/config:ro
      # L3: Unprivileged Workspace Sandbox
      - ./data/workspace/terrastella:/opt/data
      - ./data/workspace/terrastella:/workspace
      # Tool Egress Proxy CA Certificate Mount (Read-Only)
      - tool_egress_proxy_data:/etc/ssl/mitmproxy:ro
    working_dir: /opt/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_PORT=8642
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-titan_admin_secret}
      - HERMES_LITELLM_KEY=${HERMES_LITELLM_KEY:-sk-titan-terrastella-key}
      - CUSTOM_API_KEY=${HERMES_LITELLM_KEY:-sk-titan-terrastella-key}
      - OPENAI_API_KEY=${HERMES_LITELLM_KEY:-sk-titan-terrastella-key}
      - OPENAI_BASE_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - PROXY_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - LITELLM_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - MEMORY_DIR=/memories
      - WORKSPACE_DIR=/opt/data
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-4096}
      - HERMES_GATEWAY_BOOTSTRAP_STATE=running
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - SIGNAL_HTTP_URL=http://signal-cli:8080
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT:-}
      - SIGNAL_ALLOWED_USERS=${SIGNAL_ALLOWED_USERS:-}
      - TELEGRAM_BOT_NAME=@Terrastella_bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_TERRASTELLA:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS_TERRASTELLA:-${TELEGRAM_ALLOWED_USERS:-}}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse.titan.local:${LANGFUSE_PORT:-3001}}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_OTEL_AUTH=${LANGFUSE_OTEL_AUTH:-}
      - OTEL_SERVICE_NAME=hermes-terrastella
      - OTEL_RESOURCE_ATTRIBUTES=service.name=hermes-terrastella,agent.id=terrastella
      - HTTP_PROXY=http://titan-net-egress-proxy:8082
      - HTTPS_PROXY=http://titan-net-egress-proxy:8082
      - http_proxy=http://titan-net-egress-proxy:8082
      - https_proxy=http://titan-net-egress-proxy:8082
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,proxy.local,litellm,signal-cli,titan-signal-cli,titan-net-signal-cli,titan-litellm-db,titan-infra-litellm-db,.titan.local,*.titan.local,titan.local,.titan.internal,*.titan.internal,titan.internal
      - no_proxy=localhost,127.0.0.1,host.docker.internal,proxy.local,litellm,signal-cli,titan-signal-cli,titan-net-signal-cli,titan-litellm-db,titan-infra-litellm-db,.titan.local,*.titan.local,titan.local,.titan.internal,*.titan.internal,titan.internal
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    command: ["sleep", "infinity"]
    depends_on:
      - signal-cli
      - tool-egress-proxy
    networks:
      - titan-ingress
      - titan-internal

