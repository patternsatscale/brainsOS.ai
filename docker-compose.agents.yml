      - ./data/agent_workspaces/terrastella:/workspace
      # Tool Egress Proxy CA Certificate Mount (Read-Only)
      - tool_egress_proxy_data:/etc/ssl/mitmproxy:ro
    working_dir: /opt/data
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_AGENT_ID=terrastella
      - AGENT_ID=terrastella
      - HERMES_DASHBOARD=1
      - HERMES_PORT=8642
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-brainsos_admin_secret}
      - HERMES_LITELLM_KEY=${TERRASTELLA_LITELLM_KEY:-sk-brainsos-terrastella-key}
      - CUSTOM_API_KEY=${TERRASTELLA_LITELLM_KEY:-sk-brainsos-terrastella-key}
      - OPENAI_API_KEY=${TERRASTELLA_LITELLM_KEY:-sk-brainsos-terrastella-key}
      - OPENAI_BASE_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - PROXY_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - LITELLM_URL=http://proxy.local:${LITELLM_PORT:-4000}/v1
      - HERMES_STREAM_STALE_TIMEOUT=600
      - HERMES_STREAM_READ_TIMEOUT=600
      - MEMORY_DIR=/memories
      - WORKSPACE_DIR=/opt/data
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - INFERENCE_NUM_CTX=${INFERENCE_NUM_CTX:-4096}
      - HERMES_GATEWAY_BOOTSTRAP_STATE=running
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_TERRASTELLA_KEY:-}
      - SIGNAL_HTTP_URL=http://signal-cli:8080
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT_TERRASTELLA:-${SIGNAL_ACCOUNT:-}}
      - SIGNAL_ALLOWED_USERS=${SIGNAL_ALLOWED_USERS_TERRASTELLA:-${SIGNAL_ALLOWED_USERS:-}}
      - TELEGRAM_BOT_NAME=@Terrastella_bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_TERRASTELLA:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS_TERRASTELLA:-${TELEGRAM_ALLOWED_USERS:-}}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse.brainsos.local:${LANGFUSE_PORT:-3001}}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_OTEL_AUTH=${LANGFUSE_OTEL_AUTH:-}
      - OTEL_SERVICE_NAME=hermes-terrastella
      - OTEL_RESOURCE_ATTRIBUTES=service.name=hermes-terrastella,agent.id=terrastella,session.id=brainsos-terrastella-default
      - AGENT_MAIL_USER=${TERRASTELLA_MAIL_USER:-terrastella@brainsos.local}
      - AGENT_MAIL_PASSWORD=${TERRASTELLA_MAIL_PASSWORD:-brainsos_terrastella_mail_secret_change_me}
